# Recovered from the published site. Source belongs in Git; public/ does not.
title: "ukyovis' blog"
subtitle: ''
description: '2nd Year Cyber Security Student'
author: Syihab Dhiaulhaq
language: en
timezone: Asia/Kuala_Lumpur
# The former blog.ukyovis.xyz CNAME was removed from the published repository.
url: https://syiehab.github.io
root: /
permalink: :year/:month/:day/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
index_generator:
  path: ''
  per_page: 10
  order_by: -date
default_category: uncategorized
category_map:
  Writeup: writeup
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date
per_page: 10
pagination_dir: page
theme: butterfly
# Preserve these standalone pages and assets byte-for-byte.
skip_render:
  - notes/**
  - finals/**
  - cover/**
  - img/**
  - favicon.ico
