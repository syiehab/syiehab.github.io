 conversion assumption."],"trap":"Changing the CCTV clock destroys the original offset context; waiting can allow overwrite.","ref":"02-0 · slide 19 flowchart"},{"type":"scenario","topic":"02-0","q":"A business-critical server cannot be seized or fully imaged. Authority covers a specified folder. Follow the lecture's alternative collection path.","rubric":["Document the server context and confirm the authorised, relevant files/folder and reason full imaging is impractical.","Copy to a suitable destination, archive the destination copy and calculate its hash.","Obtain occupier/investigator verification signatures, label/seal, record all actions and state the limited coverage."],"trap":"Archiving on the source or claiming a folder copy is a full physical image would misstate the procedure.","ref":"02-0 · slide 20 flowchart"},{"type":"scenario","topic":"02-0","q":"A relevant social-media page is visible on a scene computer. Access is authorised. A colleague saves only one screenshot. What else should the evidence collection include?","rubric":["Record account username, device owner, viewing date/time, viewing computer and device/clock context.","Preserve relevant pages and source code, copy them to a destination, archive and hash the collected package.","Complete onsite verification documentation as applicable and continue with the computer/mobile evidence SOP and custody records."],"trap":"A screenshot alone omits the source and much of the acquisition context required by the lecture flowchart.","ref":"02-0 · slide 21; 02-1 · slide 31"},{"type":"scenario","topic":"02-0","q":"You find 80 office PCs. Seizing all would stop the business. You are not trained in pre-analysis. How do you narrow the collection responsibly?","rubric":["Use case scope, interviews and network topology to identify likely relevant devices and data.","Request an expert/senior examiner for any justified onsite pre-analysis; do not browse evidence yourself.","Have that examiner record access times/changes without editing or resaving and document the seizure/acquisition decision and limitations."],"trap":"Business disruption does not authorise untrained exploratory browsing or arbitrary exclusion of devices.","ref":"02-0 · slides 14, 22; 03 · slide 47"},{"type":"scenario","topic":"02-0","q":"You are disconnecting a computer with several similar drives and cables. What records and labels support later reconstruction?","rubric":["Photograph the original setup and connections and sketch the exhibit's location before disassembly.","Use unique parent/part/cable labels and record complete serial numbers or other identifiers and condition.","Photograph the labelled items, maintain a seizure inventory/custody trail and package each appropriately."],"trap":"A single 'computer stuff' label loses the relationships between devices and cables.","ref":"02-0 · slides 12, 22; 03 · slides 5–6"},{"type":"scenario","topic":"02-0","q":"The team plans to leave sealed drives in a locked car while everyone eats. What does the First Responder SOP require?","rubric":["Keep the evidence attended; at least one person remains in the vehicle under the lecture rule.","Maintain appropriate secure, antistatic and shock-protective packaging and controlled transport to the lab.","Record handling/transfers in custody documentation and ensure the seizure list has the required signatures."],"trap":"A seal and locked car do not replace continuous attendance under this SOP.","ref":"02-0 · slide 24; 03 · slide 4"},{"type":"scenario","topic":"02-1","q":"At the lab, your colleague suggests analysing the original disk immediately because it will save time. How do you proceed?","rubric":["Preserve the original and prepare/document a controlled acquisition with source write protection where applicable.","Acquire and validate the same source data scope using recorded hashes, tools and any read-error logs.","Secure the master/original and analyse a verified working copy while maintaining custody and an examination journal."],"trap":"Speed does not justify unnecessary modification of the original. Clean only the destination media.","ref":"02-1 · slides 26, 36–37; 02-2 · slide 41"},{"type":"scenario","topic":"03","q":"A static image fails hash verification. The acquisition log reports read errors. The deadline is tomorrow. What do you record and do?","rubric":["Treat the image as not yet validated; record the mismatch, read errors, algorithms, scope, tool/version and acquisition conditions.","Preserve the source and current logs/image; investigate the cause and use a justified repeat or alternative acquisition method if feasible.","Report the discrepancy, unrecovered areas and limitations accurately instead of claiming an exact verified copy."],"trap":"Do not suppress the mismatch, edit evidence to force a match or assume every mismatch proves malicious tampering.","ref":"02-1 · slides 24, 36–37; 03 · slides 14, 52"},{"type":"scenario","topic":"03","q":"You have a 1 TB source disk and only 600 GB free destination space. A full uncompressed raw image is required. How do you respond?","rubric":["Recognise that the required raw acquisition will not fit and that free space, not the device's advertised total, controls capacity.","Obtain sufficient destination capacity or revise the authorised plan with a justified suitable format/method; do not silently truncate the acquisition.","Allow room for records and working/backup copies, document any scope change, and validate the completed acquisition."],"trap":"Compression cannot be assumed to solve capacity, and a selected-file copy is not the required full raw image.","ref":"03 · slides 12–14, 36, 52"},{"type":"scenario","topic":"03","q":"At a cyber café, the client workstation has no local disk. Where should the investigator look next, and what relationships matter?","rubric":["Identify whether it is a diskless client and locate the server or service supplying its image/storage, including any offsite location.","Map client/server/network relationships and identify relevant cashier/manager records, user records and CCTV.","Keep collection within authority, document which source serves which client and preserve/acquire the relevant sources with qualified assistance."],"trap":"An empty local disk bay is not proof that no digital evidence exists.","ref":"03 · slides 43–45"},{"type":"scenario","topic":"03","q":"A data-centre exhibit is an unfamiliar hardware RAID supporting several virtual servers. The team proposes pulling random drives. What is the better approach?","rubric":["Record the array, drive/member identities/order, configuration and hosted system relationships before disturbing them.","Consult a trusted administrator/qualified examiner, determine RAID type, capacity and compatible acquisition method, including possible server-level acquisition.","Plan authority, business impact, destination capacity, validation and contingency; document the chosen method and limits."],"trap":"A random member disk may not independently represent the logical volume; dismantling can lose reconstruction context.","ref":"03 · slides 41–42, 50, 52"},{"type":"scenario","topic":"02-1","q":"An investigation authorised for one set of business files encounters apparently unrelated material. A teammate wants to expand the search immediately. What should the investigator do?","rubric":["Identify the existing authority and scope and avoid assuming the new material grants unrestricted search power.","Preserve/document the observation and consult the responsible investigator/legal authority about any required expansion or applicable exception.","Record the decision and continue only within the authority actually established while maintaining evidence integrity."],"trap":"The lecture's mention of plain view is not blanket authorisation for every broader digital search.","ref":"02-1 · slides 20, 29"},{"type":"scenario","topic":"02-3/4","q":"A client asks you to remove a reliable exculpatory log from the report because it weakens the allegation. What is the appropriate forensic response?","rubric":["Preserve the log and examine its relevance and reliability alongside the other evidence.","Report the finding accurately and impartially, including how it affects the conclusion and any uncertainty.","Maintain confidentiality, record the issue and follow professional/organisational processes for pressure or conflicts."],"trap":"The examiner seeks the truth; the client's desired outcome does not justify concealed findings.","ref":"02-2 · slide 4; 02-3/4 · slides 11–12"},{"type":"scenario","topic":"02-1","q":"A sealed drive arrives with no record of who held it during yesterday's transfer. Its hash matches a prior image. What should happen next?","rubric":["Record the custody gap and examine identifiers, seal condition and existing transfer documentation.","Seek factual accounts and records from the relevant custodians; identify any late entry honestly and never invent/backdate a transfer.","Preserve the evidence and disclose the unresolved gap and its implications; explain that a matching hash does not reconstruct custody."],"trap":"Integrity comparison cannot supply missing handling history.","ref":"02-1 · slides 19, 24, 44; 02-2 · slide 44"},{"type":"scenario","topic":"02-0","q":"A CCTV system cannot export the relevant footage using the available controls. Its overwrite period is short. What does the SOP direct, and what must be preserved?","rubric":["Call a qualified expert promptly rather than experimenting with unfamiliar controls or reformatting media.","Record device details, camera/channel locations, active channels, clock offset, relevant time window and overwrite urgency.","Preserve the system/evidence under the expert's justified plan, with labels/seals as appropriate and a full record of actions and custody."],"trap":"The no-export flowchart branch goes to an expert; unsupported experimentation risks destroying the only footage.","ref":"02-0 · slide 19 flowchart"},{"type":"scenario","topic":"03","q":"A remote acquisition is proposed for a suspect workstation that has endpoint security. What should be planned before installing the lecture's remote agent?","rubric":["Confirm authority, target identity, collection scope and coordination with responsible personnel.","Assess agent compatibility/detection, network limits and changes the installation/collection will make; document the method and timing.","Plan secure evidence handling, capacity, validation and a fallback if remote acquisition fails or cannot capture the needed scope."],"trap":"Remote acquisition is not invisible or change-free; it still needs validation and custody.","ref":"03 · slides 36, 51–52"}]}</script>
  <script>(() => {
  'use strict';
  const DATA=JSON.parse(document.getElementById('study-data').textContent);
  const T=DATA.topics,C=DATA.flashcards,Q=DATA.questions;
  const TYPES=['tf','mcq','term','scenario'];
  const TYPE_LABEL={tf:'True or False',mcq:'Multiple Choice',term:'Pick a Term',scenario:'Scenario Analysis'};
  const TYPE_SHORT={tf:'T / F',mcq:'MCQ',term:'Term',scenario:'Scenario'};
  const ICON={home:'⌂',notes:'▤',cards:'▣',practice:'◇',mock:'◎'};
  const STORE='digital-forensics-midterm-study-v2';
  const page=document.getElementById('page'),sidebar=document.querySelector('.sidebar');
  let noteSearch='',confirmSubmit=false,alertText='';
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const topic=id=>T.find(t=>t.id===id)||T[0];
  const countType=t=>Q.filter(q=>q.type===t).length;
  const idOf=(t,i)=>t.id+':'+i;
  const topicCards=id=>C.map((c,i)=>c[0]===id?i:-1).filter(i=>i>=0);
  function initial(){return {version:2,theme:document.documentElement.dataset.theme||'light',view:'home',topic:T[0].id,reviewed:[],card:{topic:'all',filter:'all',seed:71,index:0,flipped:false,known:[]},practice:{type:'tf',sets:{}},mock:null};}
  function load(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s?.version===2&&s.card&&s.practice){s.theme=['light','dark'].includes(s.theme)?s.theme:(document.documentElement.dataset.theme||'light');return s;}}catch{}return initial();}
  let S=load();
  function updateThemeControls(){const dark=S.theme==='dark';document.documentElement.dataset.theme=S.theme;document.querySelector('meta[name="theme-color"]').content=dark?'#0c1323':'#111b30';document.querySelectorAll('[data-theme-toggle]').forEach(button=>{button.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');button.setAttribute('aria-pressed',String(dark));if(button.classList.contains('theme-toggle')){button.querySelector('.theme-symbol').textContent=dark?'☀':'☾';button.querySelector('.theme-label').textContent=dark?'Light mode':'Dark mode';}else button.textContent=dark?'☀':'☾';});}
  function save(){try{localStorage.setItem(STORE,JSON.stringify(S));}catch{}}
  function seedHash(x){let h=2166136261;for(const c of String(x))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}
  function shuffle(items,seed){const a=[...items];let n=seedHash(seed);for(let i=a.length-1;i>0;i--){n=(Math.imul(n,1664525)+1013904223)>>>0;let j=n%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
  function cardsInDeck(){let ids=C.map((_,i)=>i).filter(i=>S.card.topic==='all'||C[i][0]===S.card.topic);if(S.card.filter==='needs')ids=ids.filter(i=>!S.card.known.includes(i));return shuffle(ids,S.card.seed);}
  function createSet(type){const seed=Date.now();return {seed,order:shuffle(Q.map((q,i)=>q.type===type?i:-1).filter(i=>i>=0),seed+type),index:0,answers:{},revealed:[],rubrics:{},submitted:false};}
  function createMock(){const seed=Date.now();return {seed,order:TYPES.flatMap(t=>shuffle(Q.map((q,i)=>q.type===t?i:-1).filter(i=>i>=0),seed+t)),index:0,answers:{},revealed:[],rubrics:{},submitted:false};}
  function currentSet(){if(S.view==='mock')return S.mock;const t=S.practice.type;return S.practice.sets[t]??(S.practice.sets[t]=createSet(t));}
  function isAnswered(set,id){const q=Q[id];if(q.type==='scenario')return Boolean((set.answers[id]||'').trim());return Object.prototype.hasOwnProperty.call(set.answers,id);}
  function stats(set){let answered=0,correct=0,objective=0,scenarios=0,reviewed=0,points=0;for(const id of set.order){const q=Q[id];if(q.type==='scenario'){scenarios++;if(set.revealed.includes(id))reviewed++;points+=(set.rubrics[id]||[]).filter(Boolean).length;}else{objective++;if(isAnswered(set,id)){answered++;if(set.answers[id]===q.a)correct++;}}}return {answered,correct,objective,scenarios,reviewed,points,completed:set.order.filter(id=>isAnswered(set,id)).length};}
  function mark(){const total=T.reduce((n,t)=>n+t.sections.length,0);return {done:S.reviewed.length,total,percent:Math.round(100*S.reviewed.length/total)};}
  function nav(){const active=S.view;document.getElementById('primary-nav').innerHTML=[['home','Overview'],['notes','Study notes'],['cards','Flashcards'],['practice','Exercises'],['mock','Mock exam']].map(([view,name])=>`<button type="button" class="nav-button${active===view?' active':''}" data-view="${view}"${active===view?' aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${ICON[view]}</span><span>${name}</span></button>`).join('');
    document.getElementById('topic-nav').innerHTML=T.map(t=>{const done=t.sections.filter((_,i)=>S.reviewed.includes(idOf(t,i))).length;return `<button type="button" class="topic-button${active==='notes'&&S.topic===t.id?' active':''}" data-open-topic="${esc(t.id)}"><span class="topic-number">${esc(t.id)}</span><span>${esc(t.title)}</span>${done===t.sections.length?'<span class="topic-done" aria-label="Completed">✓</span>':''}</button>`;}).join('');
    const m=mark();document.getElementById('sidebar-progress').innerHTML=`<strong>${m.done}/${m.total}</strong> <small>note sections reviewed</small><div class="sidebar-meter"><span style="width:${m.percent}%"></span></div>`;
  }
  function go(view){S.view=view;confirmSubmit=false;alertText='';sidebar.classList.remove('open');document.getElementById('mobile-menu').setAttribute('aria-expanded','false');render();save();window.scrollTo({top:0,behavior:'smooth'});}
  function head(eyebrow,title,description){return `<div class="page-heading"><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1>${description?`<p>${esc(description)}</p>`:''}</div>`;}
  function home(){const noteStats=mark();const known=S.card.known.length;const mock=S.mock?.submitted?stats(S.mock):null;page.innerHTML=`<section class="hero"><div class="eyebrow">YOUR MIDTERM COMPANION</div><h1>Think like a forensic investigator.</h1><p>Learn the lecture material, test the terms, and practise the field decisions that matter most.</p><div class="hero-actions"><button type="button" class="button hero-primary" data-view="notes">Start studying <span aria-hidden="true">→</span></button><button type="button" class="button hero-secondary" data-view="practice">Try an exercise</button></div></section><div class="stat-grid"><div class="stat-card"><div class="stat-value">${noteStats.done}<span class="muted">/${noteStats.total}</span></div><div class="stat-label">Sections reviewed</div></div><div class="stat-card"><div class="stat-value">${known}<span class="muted">/60</span></div><div class="stat-label">Flashcards known</div></div><div class="stat-card"><div class="stat-value">${mock?mock.correct+'/70':'90'}</div><div class="stat-label">${mock?'Last mock score':'Practice questions'}</div></div></div><section class="section-block"><div class="section-top"><div><h2>Study by chapter</h2><p>Every point follows your six lecture decks.</p></div></div><div class="topic-grid">${T.map(t=>{const done=t.sections.filter((_,i)=>S.reviewed.includes(idOf(t,i))).length;return `<button type="button" class="topic-card" data-open-topic="${esc(t.id)}"><div class="topic-card-top"><span class="topic-code">${esc(t.id)}</span><span class="topic-count">${done}/${t.sections.length} reviewed</span></div><h3>${esc(t.title)}</h3><p>${t.sections.length} focused sections · ${topicCards(t.id).length} flashcards</p><div class="topic-card-foot">Open notes <span aria-hidden="true">↗</span></div></button>`;}).join('')}</div></section><section class="section-block"><div class="exam-strip"><div><strong>Practice the actual question mix</strong><span>20 True or False · 35 MCQs · 15 Pick a Term · 20 scenarios</span></div><button type="button" class="button primary" data-view="mock">Open mock exam</button></div></section>`;}
  function sectionHTML(t,s,i){const key=idOf(t,i),done=S.reviewed.includes(key);return `<details class="note-card" id="section-${i}"${i===0?' open':''}><summary class="note-summary"><span class="note-index">${String(i+1).padStart(2,'0')}</span><strong>${esc(s.title)}</strong>${done?'<span class="note-check">✓ Reviewed</span>':''}<span class="chevron" aria-hidden="true">⌄</span></summary><div class="note-body"><ul>${s.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><div class="note-foot"><span class="source-tag">${esc(s.ref)}</span><button type="button" class="button ${done?'secondary':'primary'}" data-review="${esc(key)}">${done?'Reviewed ✓':'Mark as reviewed'}</button></div></div></details>`;}
  function notes(){const t=topic(S.topic),done=t.sections.filter((_,i)=>S.reviewed.includes(idOf(t,i))).length;page.innerHTML=`<div class="notes-layout"><div class="notes-main"><div class="eyebrow">LECTURE ${esc(t.id)}</div><div class="chapter-head"><div class="chapter-symbol">${esc(t.id)}</div><div><h1>${esc(t.title)}</h1><p>${esc(t.deck)} · ${done}/${t.sections.length} sections reviewed</p></div></div><div class="notes-tools"><div class="search-wrap"><label class="sr-only" for="note-search">Search this chapter</label><input id="note-search" class="field" type="search" placeholder="Search within this chapter" value="${esc(noteSearch)}"></div><button type="button" class="button secondary" data-action="expand-all">Expand all</button></div><div class="notes-stack" id="notes-stack"></div><div class="clarifications"><h2>Points to handle carefully</h2><p class="muted tiny">These notes flag slide wording that can lead to an overgeneralised field decision.</p>${DATA.clarifications.map(c=>`<details><summary>${esc(c.title)}</summary><p>${esc(c.text)}</p>${c.url?`<p><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.label)} ↗</a></p>`:''}</details>`).join('')}</div></div><aside class="toc-panel" aria-label="On this page"><h3>In this chapter</h3>${t.sections.map((s,i)=>`<button type="button" data-section="${i}">${String(i+1).padStart(2,'0')} &nbsp;${esc(s.title)}</button>`).join('')}<div class="toc-progress">${done} of ${t.sections.length} sections reviewed</div></aside></div>`;filterNotes();}
  function filterNotes(){const t=topic(S.topic),query=noteSearch.trim().toLocaleLowerCase();const matches=t.sections.map((s,i)=>({s,i})).filter(({s})=>!query||(s.title+' '+s.points.join(' ')+' '+s.ref).toLocaleLowerCase().includes(query));document.getElementById('notes-stack').innerHTML=matches.length?matches.map(({s,i})=>sectionHTML(t,s,i)).join(''):'<div class="empty-state"><h2>No matching section</h2><p class="muted">Try another keyword in this chapter.</p></div>';}
  function flashcards(){const ids=cardsInDeck(),cs=S.card;cs.index=Math.min(Math.max(cs.index,0),Math.max(0,ids.length-1));const id=ids[cs.index],c=C[id];page.innerHTML=`${head('ACTIVE RECALL','Flashcards','Recall the answer before flipping. Mark what you know to track your progress.')}<div class="filter-row"><div class="segmented" aria-label="Flashcard filter"><button type="button" data-card-filter="all" class="${cs.filter==='all'?'active':''}" aria-pressed="${cs.filter==='all'}">All cards</button><button type="button" data-card-filter="needs" class="${cs.filter==='needs'?'active':''}" aria-pressed="${cs.filter==='needs'}">Need review</button></div><label class="sr-only" for="card-topic">Card chapter</label><select class="field select-small" id="card-topic"><option value="all">All chapters</option>${T.map(t=>`<option value="${esc(t.id)}"${cs.topic===t.id?' selected':''}>${esc(t.id+' · '+t.title)}</option>`).join('')}</select></div>${ids.length?`<div class="flash-shell"><div class="flash-top"><span class="pill">${esc(c[0]+' · '+topic(c[0]).title)}</span><span class="muted tiny">Card ${cs.index+1} of ${ids.length}</span></div><button type="button" class="flash-stage" data-action="flip-card" aria-label="${cs.flipped?'Show question':'Reveal answer'}"><span class="stage-inner"><span class="stage-label">${cs.flipped?'ANSWER':'QUESTION'}</span><span class="stage-text">${esc(cs.flipped?c[2]:c[1])}</span>${cs.flipped?`<span class="stage-ref">Source: ${esc(c[3])}</span>`:''}</span></button><div class="flash-footer"><div class="action-row">${cs.flipped?`<button type="button" class="button secondary" data-action="card-again">Study again</button><button type="button" class="button primary" data-action="card-known">I knew this</button>`:'<button type="button" class="button primary" data-action="flip-card">Reveal answer</button>'}</div><div class="action-row"><button type="button" class="button secondary" data-action="card-prev"${cs.index===0?' disabled':''}>← Previous</button><button type="button" class="button secondary" data-action="card-next"${cs.index===ids.length-1?' disabled':''}>Next →</button></div></div><div class="flash-progress"><div class="progress-track"><span class="progress-fill" style="width:${Math.round(100*S.card.known.length/C.length)}%"></span></div><p class="tiny muted" style="margin:7px 0 0">${S.card.known.length} of ${C.length} cards marked known</p></div></div>`:`<div class="empty-state"><h2>All caught up</h2><p class="muted">Every card in this selection is marked known.</p><button type="button" class="button primary" data-card-filter="all">Show all cards</button></div>`}<div class="action-row" style="margin-top:16px"><button type="button" class="button ghost" data-action="shuffle-cards">Shuffle cards</button></div>`;}
  function typeTabs(){return `<div class="segmented" aria-label="Question format">${TYPES.map(t=>`<button type="button" data-practice-type="${t}" class="${S.practice.type===t?'active':''}" aria-pressed="${S.practice.type===t}">${TYPE_LABEL[t]} <span class="tiny">(${countType(t)})</span></button>`).join('')}</div>`;}
  function practice(){page.innerHTML=`${head('PRACTICE MODE','Exercises','Check each answer immediately, then use the explanation to close the gap.')}${typeTabs()}<div style="height:22px"></div><div id="exercise-area"></div>`;exerciseArea(false);}
  function mock(){if(!S.mock){page.innerHTML=`${head('EXAM SIMULATION','Full mock exam','Work through all 90 questions in the same mix as your midterm. Answers appear after you submit.')}<div class="mock-intro"><div class="format-grid">${TYPES.map(t=>`<div class="format-tile"><strong>${countType(t)}</strong><span>${TYPE_LABEL[t]}</span></div>`).join('')}</div><div class="panel" style="padding:24px"><h2>Ready to begin?</h2><p class="muted">You can move between questions and change your answers before submission. The 70 objective questions are marked automatically. The 20 field scenarios include a three-point self-check rubric.</p><p class="tiny muted">No timer is set because your exam duration was not supplied.</p><button type="button" class="button primary" data-action="start-mock">Start 90-question mock</button></div></div>`;return;}page.innerHTML=`${head('EXAM SIMULATION','Full mock exam',S.mock.submitted?'Review your answers and self-check the field scenarios.':'Your answers stay hidden until you submit. You can return to any question.')}<div id="exercise-area"></div>`;exerciseArea(true);}
  function optionsFor(q,id,set,locked){if(q.type==='scenario')return `<label class="field-label" for="scenario-answer">Your response: action, reason and documentation</label><textarea id="scenario-answer" class="field scenario-field" maxlength="4000" placeholder="Describe what you would do, why, and what you would record."${locked?' readonly':''}>${esc(set.answers[id]||'')}</textarea><p class="tiny muted" style="margin:8px 0 0">Saved in this browser as you type.</p>`;
    if(q.type==='term'){const bank=shuffle(Q.filter(x=>x.type==='term').map(x=>x.a),set.seed+'bank');return `<label class="field-label" for="term-answer">Choose the matching term</label><select id="term-answer" class="field term-field"${locked?' disabled':''}><option value="">Select a term</option>${bank.map(x=>`<option value="${esc(x)}"${set.answers[id]===x?' selected':''}>${esc(x)}</option>`).join('')}</select>`;}
    const opts=q.type==='tf'?[{label:'True',value:true},{label:'False',value:false}]:shuffle(q.options.map((label,value)=>({label,value})),set.seed+'choice'+id);return `<div class="answer-list" role="group" aria-label="Answer choices">${opts.map((o,i)=>{const selected=set.answers[id]===o.value,correct=locked&&o.value===q.a,wrong=locked&&selected&&o.value!==q.a;return `<label class="answer-option${selected?' selected':''}${correct?' correct':''}${wrong?' wrong':''}${locked?' locked':''}"><input type="radio" name="answer-choice" value="${esc(o.value)}"${selected?' checked':''}${locked?' disabled':''}><span class="option-letter">${q.type==='tf'?(o.value?'T':'F'):String.fromCharCode(65+i)}</span><span class="option-text">${esc(o.label)}</span></label>`;}).join('')}</div>`;}
  function feedbackFor(q,id,set,show){if(!show)return '';if(q.type==='scenario'){const marks=set.rubrics[id]||[false,false,false];return `<div class="feedback"><h3>Self-check rubric · 1 point per idea</h3><div class="rubric-list">${q.rubric.map((p,i)=>`<label class="rubric-item"><input type="checkbox" data-rubric="${i}"${marks[i]?' checked':''}><span>${esc(p)}</span></label>`).join('')}</div><p><strong>Common mistake:</strong> ${esc(q.trap)}</p><span class="source-tag">Source: ${esc(q.ref)}</span></div>`;}
    const a=set.answers[id],ok=a===q.a,label=q.type==='mcq'?q.options[q.a]:q.type==='tf'?(q.a?'True':'False'):q.a;return `<div class="feedback${ok?'':' needs-work'}"><h3>${ok?'Correct answer':'Review this one'}</h3><p><strong>Answer:</strong> ${esc(label)}</p><p>${esc(q.why)}</p><span class="source-tag">Source: ${esc(q.ref)}</span></div>`;}
  function resultBanner(set){const s=stats(set);return `<div class="result-banner"><div class="eyebrow" style="color:#21846c">ATTEMPT COMPLETE</div><h2>Review your investigation.</h2><p>Use the question picker to see explanations and check your scenario reasoning.</p><div class="result-score"><div><strong>${s.correct}/${s.objective}</strong><br><span>Objective score</span></div><div><strong>${s.reviewed}/${s.scenarios}</strong><br><span>Scenarios reviewed</span></div><div><strong>${s.points}/${s.scenarios*3}</strong><br><span>Scenario rubric points</span></div></div></div>`;}
  function exerciseArea(mockMode){const area=document.getElementById('exercise-area'),set=currentSet();const id=set.order[set.index],q=Q[id],s=stats(set),show=mockMode?set.submitted:set.revealed.includes(id),locked=mockMode?set.submitted:set.revealed.includes(id),responseCount=set.order.filter(i=>isAnswered(set,i)).length;
    const quiz=`<div class="quiz-shell"><div class="quiz-top"><div class="quiz-meta"><span class="pill">${esc(TYPE_LABEL[q.type])}</span><span class="muted tiny">Question ${set.index+1} of ${set.order.length} · ${responseCount} answered</span></div><div class="progress-track"><span class="progress-fill" style="width:${100*responseCount/set.order.length}%"></span></div></div><div class="quiz-body"><div class="eyebrow" style="font-size:.69rem;margin-bottom:8px">${esc(q.topic+' · '+topic(q.topic).title)}</div><h2>${esc(q.q)}</h2>${optionsFor(q,id,set,locked)}<div id="validation" role="alert"></div>${feedbackFor(q,id,set,show)}</div><div class="quiz-footer"><div class="action-row">${!mockMode&&!show?`<button type="button" class="button primary" data-action="check-answer">${q.type==='scenario'?'Reveal model points':'Check answer'}</button>`:''}${mockMode&&set.submitted&&q.type==='scenario'&&!set.revealed.includes(id)?'<button type="button" class="button primary" data-action="mark-scenario">Mark reviewed</button>':''}</div><div class="action-row"><button type="button" class="button secondary" data-action="question-prev"${set.index===0?' disabled':''}>← Previous</button><button type="button" class="button secondary" data-action="question-next"${set.index===set.order.length-1?' disabled':''}>Next →</button></div></div></div>`;
    const jump=`<div class="question-nav"><label class="field-label" for="question-jump">Jump to question</label><select class="field" id="question-jump">${set.order.map((qid,i)=>`<option value="${i}"${i===set.index?' selected':''}>${i+1}. ${esc(TYPE_SHORT[Q[qid].type])}${isAnswered(set,qid)?' · answered':''}${(mockMode?set.submitted:set.revealed.includes(qid))&&Q[qid].type!=='scenario'?(set.answers[qid]===Q[qid].a?' · correct':' · review'):''}</option>`).join('')}</select></div>`;
    const submit=mockMode&&!set.submitted?`<div class="section-block">${confirmSubmit?`<div class="notice">${set.order.length-responseCount} questions are unanswered. Submit this attempt and reveal the answers?</div><div class="action-row"><button type="button" class="button primary" data-action="confirm-submit">Submit and show results</button><button type="button" class="button secondary" data-action="cancel-submit">Keep working</button></div>`:'<button type="button" class="button primary" data-action="request-submit">Submit mock exam</button>'}</div>`:'';
    const complete=!mockMode&&set.revealed.length===set.order.length;
    const extra=(mockMode&&set.submitted)||complete?`<div class="action-row" style="margin-top:22px">${complete&&q.type!=='scenario'?'<button type="button" class="button secondary" data-action="retry-missed">Retry missed</button>':''}<button type="button" class="button ghost" data-action="new-set">${mockMode?'Start a new mock':'Repeat this format'}</button></div>`:'';
    area.innerHTML=(mockMode&&set.submitted?resultBanner(set):'')+quiz+jump+submit+extra;
  }
  function render(){updateThemeControls();nav();if(S.view==='home')home();else if(S.view==='notes')notes();else if(S.view==='cards')flashcards();else if(S.view==='practice')practice();else if(S.view==='mock')mock();else{S.view='home';home();}if(alertText){const target=document.getElementById('validation');if(target)target.innerHTML=`<div class="notice">${esc(alertText)}</div>`;alertText='';}}
  function jumpQuestion(next){const set=currentSet();set.index=Math.min(Math.max(next,0),set.order.length-1);confirmSubmit=false;exerciseArea(S.view==='mock');save();document.querySelector('.quiz-shell')?.scrollIntoView({block:'start',behavior:'smooth'});}
  document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;
    if(target.hasAttribute('data-theme-toggle')){S.theme=S.theme==='dark'?'light':'dark';updateThemeControls();save();return;}
    if(target.dataset.view){go(target.dataset.view);return;}
    if(target.dataset.openTopic){S.topic=target.dataset.openTopic;noteSearch='';go('notes');return;}
    if(target.dataset.section!==undefined){const el=document.getElementById('section-'+target.dataset.section);if(el){el.open=true;el.scrollIntoView({block:'start',behavior:'smooth'});}return;}
    if(target.dataset.review){const k=target.dataset.review;S.reviewed=S.reviewed.includes(k)?S.reviewed.filter(x=>x!==k):[...S.reviewed,k];const open=[...document.querySelectorAll('.note-card[open]')].map(x=>x.id);render();open.forEach(id=>{const x=document.getElementById(id);if(x)x.open=true;});save();return;}
    if(target.dataset.cardFilter){S.card.filter=target.dataset.cardFilter;S.card.index=0;S.card.flipped=false;flashcards();save();return;}
    if(target.dataset.practiceType){S.practice.type=target.dataset.practiceType;render();save();return;}
    const action=target.dataset.action;if(!action)return;
    if(action==='expand-all'){document.querySelectorAll('.note-card').forEach(x=>x.open=true);target.textContent='All expanded';return;}
    if(action==='flip-card'){S.card.flipped=!S.card.flipped;flashcards();save();return;}
    if(action==='shuffle-cards'){S.card.seed=Date.now();S.card.index=0;S.card.flipped=false;flashcards();save();return;}
    if(action==='card-prev'||action==='card-next'){S.card.index+=action==='card-next'?1:-1;S.card.flipped=false;flashcards();save();return;}
    if(action==='card-known'||action==='card-again'){const ids=cardsInDeck(),id=ids[S.card.index];S.card.known=S.card.known.filter(x=>x!==id);if(action==='card-known')S.card.known.push(id);if(S.card.filter==='needs')S.card.index=Math.min(S.card.index,cardsInDeck().length-1);else S.card.index=(S.card.index+1)%ids.length;S.card.flipped=false;flashcards();save();return;}
    if(action==='start-mock'){S.mock=createMock();confirmSubmit=false;render();save();return;}
    if(action==='question-prev'||action==='question-next'){jumpQuestion(currentSet().index+(action==='question-next'?1:-1));return;}
    if(action==='check-answer'){const set=currentSet(),id=set.order[set.index],q=Q[id];if(!isAnswered(set,id)){document.getElementById('validation').innerHTML='<div class="notice">Add your answer before checking.</div>';return;}if(!set.revealed.includes(id))set.revealed.push(id);exerciseArea(false);save();return;}
    if(action==='mark-scenario'){const set=currentSet(),id=set.order[set.index];if(!set.revealed.includes(id))set.revealed.push(id);exerciseArea(true);save();return;}
    if(action==='request-submit'){confirmSubmit=true;exerciseArea(true);return;}
    if(action==='cancel-submit'){confirmSubmit=false;exerciseArea(true);return;}
    if(action==='confirm-submit'){S.mock.submitted=true;S.mock.index=0;confirmSubmit=false;exerciseArea(true);save();window.scrollTo({top:0,behavior:'smooth'});return;}
    if(action==='retry-missed'){const type=S.practice.type,old=currentSet(),missed=old.order.filter(id=>Q[id].type!=='scenario'&&old.answers[id]!==Q[id].a);if(!missed.length){document.getElementById('validation').innerHTML='<div class="notice">All answers are correct in this set.</div>';return;}const next=createSet(type);next.order=missed;S.practice.sets[type]=next;exerciseArea(false);save();return;}
    if(action==='new-set'){if(S.view==='mock')S.mock=createMock();else S.practice.sets[S.practice.type]=createSet(S.practice.type);confirmSubmit=false;render();save();return;}
  });
  document.addEventListener('change',e=>{const t=e.target;
    if(t.id==='card-topic'){S.card.topic=t.value;S.card.index=0;S.card.flipped=false;flashcards();save();return;}
    if(t.id==='question-jump'){jumpQuestion(Number(t.value));return;}
    if(t.id==='term-answer'){const set=currentSet(),id=set.order[set.index];if(t.value)set.answers[id]=t.value;else delete set.answers[id];exerciseArea(S.view==='mock');save();return;}
    if(t.name==='answer-choice'){const set=currentSet(),id=set.order[set.index],q=Q[id];set.answers[id]=q.type==='tf'?t.value==='true':Number(t.value);exerciseArea(S.view==='mock');save();return;}
    if(t.dataset.rubric!==undefined){const set=currentSet(),id=set.order[set.index],marks=set.rubrics[id]||[false,false,false];marks[Number(t.dataset.rubric)]=t.checked;set.rubrics[id]=marks;save();if(S.view==='mock')exerciseArea(true);return;}
  });
  document.addEventListener('input',e=>{const t=e.target;
    if(t.id==='note-search'){noteSearch=t.value;filterNotes();return;}
    if(t.id==='scenario-answer'){const set=currentSet(),id=set.order[set.index];set.answers[id]=t.value;save();const tag=document.querySelector('.quiz-meta .tiny');if(tag)tag.textContent=`Question ${set.index+1} of ${set.order.length} · ${set.order.filter(i=>isAnswered(set,i)).length} answered`;const bar=document.querySelector('.quiz-top .progress-fill');if(bar)bar.style.width=(100*set.order.filter(i=>isAnswered(set,i)).length/set.order.length)+'%';return;}
  });
  document.getElementById('mobile-menu').addEventListener('click',()=>{const open=sidebar.classList.toggle('open');document.getElementById('mobile-menu').setAttribute('aria-expanded',String(open));document.getElementById('mobile-menu').setAttribute('aria-label',open?'Close navigation':'Open navigation');});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sidebar.classList.contains('open')){sidebar.classList.remove('open');document.getElementById('mobile-menu').setAttribute('aria-expanded','false');}});
  render();
})();
</script>
</body>
