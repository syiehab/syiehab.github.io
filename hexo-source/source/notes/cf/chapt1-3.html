html[data-theme="dark"]{
  color-scheme:dark;
  --ink:#eef3ff;
  --ink-soft:#adbad1;
  --nav:#0a1221;
  --nav-line:#25334c;
  --nav-text:#dce7f7;
  --paper:#101827;
  --surface:#1a2538;
  --line:#31415a;
  --primary:#a6b5ff;
  --primary-dark:#bec9ff;
  --primary-light:#293657;
  --mint:#84dec0;
  --mint-light:#1a3a34;
  --amber:#ffd18b;
  --amber-light:#3d3221;
  --rose:#ffa8bd;
  --rose-light:#442832;
  --shadow:0 18px 50px rgba(0,0,0,.22);
}

html[data-theme="dark"] .brand-mark{background:linear-gradient(145deg,#697cf2,#4357c8)}
html[data-theme="dark"] .hero{background:radial-gradient(circle at 88% 10%,rgba(112,132,240,.22),transparent 34%),linear-gradient(125deg,#1e2c53,#182440 70%,#233865)}
html[data-theme="dark"] .stat-card,
html[data-theme="dark"] .topic-card,
html[data-theme="dark"] .note-card,
html[data-theme="dark"] .toc-panel,
html[data-theme="dark"] .flash-shell,
html[data-theme="dark"] .quiz-shell,
html[data-theme="dark"] .panel,
html[data-theme="dark"] .clarifications details,
html[data-theme="dark"] .empty-state,
html[data-theme="dark"] .format-tile{background:var(--surface);border-color:var(--line);color:var(--ink)}
html[data-theme="dark"] .topic-card:hover{border-color:#6175ab}
html[data-theme="dark"] .exam-strip{background:#202d49;border-color:#394a75}
html[data-theme="dark"] .button.primary{background:#6579ed;color:#fff}
html[data-theme="dark"] .button.primary:hover{background:#788af6;box-shadow:0 9px 20px rgba(0,0,0,.16)}
html[data-theme="dark"] .button.secondary{background:#223049;color:var(--ink);border-color:#3b4c69}
html[data-theme="dark"] .button.secondary:hover{border-color:#7084a5}
html[data-theme="dark"] .button.hero-primary{background:#fff;color:#263758}
html[data-theme="dark"] .button.hero-secondary{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.27);color:#fff}
html[data-theme="dark"] .chapter-symbol,
html[data-theme="dark"] .note-index,
html[data-theme="dark"] .topic-code,
html[data-theme="dark"] .pill{background:var(--primary-light);color:var(--primary)}
html[data-theme="dark"] .pill.green{background:var(--mint-light);color:var(--mint)}
html[data-theme="dark"] .note-summary:hover{background:#233149}

  <script type="application/json" id="study-data">{"topics":[{"id":"01","title":"Understanding Computer Forensics","deck":"01-Understanding Computers Forensics.pptx","sections":[{"title":"Purpose, scope and history","ref":"01 · slides 3–12","points":["Computer forensics focuses on computers. Digital forensics also covers phones, cameras, removable media and other digital devices. The terms are often used interchangeably in the slides.","The goal is to identify, analyse and reconstruct events, preserve evidence in its original form, and present admissible findings. Scientific methods cover preservation, collection, validation, identification, analysis, interpretation, documentation and presentation.","Investigations can uncover intellectual-property theft, harassment, deleted records, unlicensed software, fraud and changes to files. A trace must be interpreted in context rather than treated as proof of a person's actions on its own.","History anchors in the slides: Hans Gross—investigation principles; Locard—crime laboratory and exchange principle; Galton—fingerprints; Goddard—firearm comparison; Osborn—document examination. Digital milestones: CART 1984, first international computer-evidence conference 1993, IOCE 1995, IFSS 1998, first FBI regional computer-forensics laboratory 2000.","Departing-employee example: preserve the machine, photograph it and record custody. Do not let IT reinstall its OS or reassign it. RAM may matter if it is running. USB connection history, recently opened files and browser activity can help reconstruct a transfer."]},{"title":"Public and private investigations","ref":"01 · slides 14–19","points":["Criminal: public offences and prosecution, normally brought by the state; deterrence and punishment are the slide objectives.","Civil: disputes between parties seeking remedies, damages or compensation. A private party brings the claim.","Administrative: government rules and regulation, protecting public interests in dealings with government.","Private-sector: company-policy or employment-contract issues and litigation, including harassment, sabotage, falsified data and industrial espionage. An Acceptable Use Policy helps define permitted use and investigation boundaries.","An internal investigation may develop into a criminal matter. Keep it confidential, preserve evidence and reassess authority and scope."]},{"title":"Malaysia: names to recognise from the lecture","ref":"01 · slides 21–28","points":["Lecture associations: Computer Crimes Act 1997—computer misuse and unauthorised access; Communications and Multimedia Act 1998—networked communications and services; Penal Code—criminal offences.","Copyright Act 1987—copyright protection; Personal Data Protection Act 2010—personal-data processing in the commercial context described by the slides; Digital Signature Act 1997—listed in the framework.","Learn these as the lecture's act-name/topic associations. The slides include dated examples and simplified legal descriptions; this study guide does not restate them as current legal advice.","Key forensic issue: evidence should remain accounted for and untampered with from collection to presentation. Authority to investigate and integrity of evidence are separate requirements."]},{"title":"Malaysia: organisations and services","ref":"01 · slides 30–34","points":["CyberSecurity Malaysia grew from NISER in the lecture account. Its listed services include computer, mobile, audio and video forensics, first response, recovery, sanitisation and expert witness work.","The lab accreditation cited in the slides refers to ISO/IEC 17025:2005 and ASCLD/LAB requirements of that period. Treat dates and accreditation claims as lecture history.","LGMS: litigation support, computer fraud, digital artifacts, mobile forensics, data recovery/destruction and expert testimony. OG IT Forensics: forensic tools and central evidence management. BDO: digital evidence recovery, cyber forensics, forensic data analysis and document management."]}]},{"id":"02-0","title":"First Responder SOP","deck":"02-0_First Responder SOP.pptx","sections":[{"title":"Prepare → conduct → collect → transport","ref":"02-0 · slides 3–14, 24–25","points":["Identification asks: what crime, who is involved, where, which resources, and which documents? Preserve initial web information, relevant identifiers and location clues.","Prepare a briefing covering people, purpose, premises, suspect's IT ability, strategy, equipment, transport and lodging. Bring competent personnel, an investigation diary, seizure list and chain-of-custody form.","Kit: camera, labels/markers, anti-static and shock-protective packaging, acquisition and pre-analysis tools, sufficient destination storage, power supplies, small tools and torch. Synchronise the team's clocks to a trusted reference; record evidence-device clock offsets rather than correcting their clocks.","At entry, the raiding officer identifies themselves and explains the purpose. Identify the person in charge and occupants, check rooms and wireless connectivity, move people away from devices, and refuse unauthorised assistance.","Interview the technical person, identify evidence relevant to the case, sketch premises and exhibit positions, and document users, internet access/ISP, offsite storage and relevant account details within authority.","Decide whether to seize, acquire, or do both; whether a full image or selected files are appropriate; and whether storage is sufficient. More exhibits mean more analysis time.","Transport in anti-static, shock-resistant packaging. Maintain custody; both the first responder and PIC/owner/suspect sign the seizure list. The lecture requires at least one person to remain with evidence in the vehicle at all times."]},{"title":"Computer decision points","ref":"02-0 · slide 16 flowchart; 03 · slides 2–3","points":["Interview for owner and credentials. If on, document the display, current account, time offset, IP and MAC addresses. Also record serial number, connectivity/ISP and ownership.","A server follows the server/cloud flowchart or requires an expert. For a workstation, the flowchart checks destructive activity and networking; document transfers/processes before justified isolation, consider credentials, and assess encryption or SSD complications.","If off, do not switch it on merely to inspect it. Photograph, label and preserve it. A dark monitor alone does not establish that the computer is off.","The flowchart includes a pull-the-plug path. It must be read alongside the acquisition slides' warnings about RAM and encryption. Explain which branch and risk justify your decision; do not memorise 'always unplug'.","Finish with labels/seals, relevant accessories and power supply, and a record of every action. Do not exceed your competence when an expert is needed."]},{"title":"Mobile phone decision points","ref":"02-0 · slides 17–18 flowchart","points":["Record make/model, unique marks, owner, time offset and available identifiers: IMEI (equipment), IMSI (subscriber) and ICCID (SIM card), plus serial number.","With an expert available, the expert decides power state, network isolation and whether to extract onsite. Losing power may lose data or accessible state; connectivity may permit changes or a remote wipe.","The no-expert branch of this lecture flowchart keeps an already-off device off, and uses flight mode or shielding for an on device before labelling/sealing. Collect accessories including its power cable.","02-2 slide 36 gives a different, generic shutdown sequence. For a question explicitly asking for that slide, recognise its wording; for a tactical scenario, state device condition and justify the expert-led preservation/isolation choice. Do not assume removing a SIM blocks Wi-Fi."]},{"title":"CCTV, server/cloud and web evidence","ref":"02-0 · slides 19–21 flowcharts","points":["CCTV: record camera count, active cameras, channel-to-location map, clock offset, make/model and overwrite period. Confirm the case's channel and date/time before export.","CCTV export: use native/proprietary format when the player is available; the lecture fallback is AVI/MPEG when it is not. Hash exported files, label/seal and document. If export is not possible, call an expert.","Server/cloud: record clock offset, OS, relevant applications, MAC/IP and device details. Confirm relevant files/folders. If imaging is possible, image then hash. Otherwise copy the selected files/folders to a destination, archive the copy there and hash the archive.","For the server/cloud copy, occupier and investigator sign the verification form. Label/seal and document every action. Selected-file collection has narrower coverage than a full image.","Social/web: record username, device owner, viewing date/time and the computer used. Preserve relevant pages and their source code, copy to the destination, archive and hash. Onsite, record device details and the verification signatures; then follow the relevant computer/mobile procedure."]},{"title":"Pre-analysis, labels and time offsets","ref":"02-0 · slides 22–25","points":["Onsite pre-analysis may be justified when many devices make blanket seizure disruptive. The slides restrict this to expert or senior personnel because browsing can change evidence.","Record the date/time before browsing. Do not edit or resave. Document changes and the decision to seize or acquire. Ordinary file copying may change destination creation times.","Labels must be unique. Link the parent device to its subdevices and cables, record complete serial numbers or unique identifiers, and photograph overall and close-up labelled views.","Worked time example: a CCTV clock shows 14:00 when a trusted reference shows 14:07. Its clock is 7 minutes slow; a recording stamped 13:20 corresponds to 13:27 reference time if that offset was stable. Preserve both values and the assumption; do not change the recorder clock."]}]},{"id":"02-1","title":"Investigation Methodology","deck":"02-1_Digital Forensics Investigation Methodology.pptx","sections":[{"title":"People, phases and readiness","ref":"02-1 · slides 3–18","points":["A first responder is authorised, trained and qualified to act first in collecting/acquiring and handling digital evidence. The deck also names analyst, technical assistant, QA officer and R&D officer roles.","First responders identify and preserve evidence and maintain integrity. Investigators establish command and conduct the search. Tagging and transport responsibilities depend on the agency SOP.","Pre-investigation: authority, goals, tools, budget, competent team, secure laboratory, evidence lockers, QA and auditing. Investigation: scene collection/preservation and laboratory examination, analysis, reconstruction and presentation. Post-investigation: close the case, manage return/storage and review lessons.","Before accepting a case consider its nature, criminal/civil status, volatility, organisational impact, legal/privacy exposure, liability, age and court deadline. A case intake form helps establish agreement and identify conflicts of interest.","Lab basics in the lecture: restricted physical access, secure containers, logs and workstations; ISO/IEC 17025 relates to laboratory competence. Investigator challenges include encryption, steganography, wiping, media variety, data volume and limited time.","Maintain objectivity and confidentiality; document methods in a journal, train continuously and represent qualifications honestly."]},{"title":"Four stages, with preservation throughout","ref":"02-1 · slides 27–44","points":["Identification: gather crime, location and people information; verify authority; plan resources and preserve preliminary web material and source code.","Collection: prepare, secure the scene, interview, identify exhibits, sketch/photograph, record device details, label cables/devices and package appropriately. Choose seizure/acquisition based on objectives and constraints.","Analysis: agree objectives with the investigating officer, work on a verified image in a controlled environment, examine relevant active data, slack and unallocated space, reconstruct activity and record every step.","Presentation: communicate findings through a report, demonstration or slides. The deck's quality words are accurate, repeatable, impartial and verifiable.","Preservation spans every stage: keep an unbroken chain of custody and secure sealed evidence when it is not being analysed. It is not merely a final step."]},{"title":"Authority and chain of custody","ref":"02-1 · slides 9–10, 19–20, 29, 44–47, 51","points":["Verify the applicable permission before search and seizure, and work within its scope. The lecture discusses warrants, consent and limited exceptions; do not treat these summaries as universal rules across jurisdictions.","Chain of custody records the evidence's route from discovery to case closure/court. Record each custodian, transfer, action, date/time, location and evidence identity, with the required signatures.","A hash supports content integrity. It does not replace a custody history or establish who created a file.","Tags link exhibits and parts. The lecture pattern aaa/ddmmyy/nnnn/zz represents investigator initials, seizure date, exhibit sequence and part sequence. Its example JSM/051226/0001/01 means 5 December 2026, first item, first part.","Scene records include make/model/serial, removable media, peripherals, cables, wireless devices, notes and general condition. Secure packaging should also preserve fingerprints or other trace evidence where relevant."]},{"title":"Image, clone, hash and write blocker","ref":"02-1 · slides 22–26, 36–37; 03 · slides 12–14","points":["Image: bit-for-bit acquisition stored as file(s), such as raw or a forensic container. Imaging does not inherently require compression: raw is normally uncompressed, and some container formats offer compression.","Clone: bit-for-bit copy onto another device. A suitable destination needs enough addressable capacity. A clone may support simulation or boot testing after preserving the original and recording any test changes.","Hash: a digest of the bytes being hashed. MD5 is 128 bits, conventionally 32 hexadecimal characters; SHA-1 is 160 bits, conventionally 40 hexadecimal characters. The lecture emphasises comparing hashes to validate integrity.","Reading bytes alone does not change their digest. An access operation may change filesystem metadata or other system state. Compare the same data scope, algorithm and acquisition state; a container-file hash is different from the hash of its decoded source data.","Write blocker: hardware or software that prevents writes to the protected source while permitting reads. Hashing detects differences; write blocking helps prevent them.","Acquisition sequence: document tool/configuration, prepare clean destination media, activate write protection where applicable, acquire, validate, keep a master and use a working copy. Clean the destination, never wipe the source."]},{"title":"Examination layers and reporting","ref":"02-1 · slides 38–43, 52–58","points":["Layer 1: filesystem structure, partitions and OS information. Layer 2: exclude known files with hashes, compare headers/extensions, inspect obvious interests. Layer 3: protected/encrypted, compressed and deleted files plus link analysis. Layer 4: unallocated and slack space. Layer 5: document extraction method and destination.","File analysis uses contents, metadata, directories, configurations and patterns. Time analysis considers creation, modification and access times; interpret clock offsets and tool effects. Data-hiding analysis considers passwords, compression, encryption and steganography.","Report: summary, body, conclusion and supplementary material. Include case/examiner details, authority, scene records, custody, acquisition and analysis methods, searches, findings, ownership analysis, hiding techniques and limitations.","Recovery tools named: Recuva, Advanced Disk Recovery, UndeletePlus, TSK/Autopsy, EnCase and FTK Imager. Recoverability is conditional; deleted does not automatically mean recoverable."]}]},{"id":"02-2","title":"Digital Evidence","deck":"02-2_Digital Evidence.pptx","sections":[{"title":"Evidence vocabulary","ref":"02-2 · slides 3–6","points":["Digital evidence is information of investigative value stored on, received by or transmitted through a digital device. Examples: logs, browser history, email, documents, spreadsheets, audio, images and video.","Inculpatory suggests guilt; exculpatory supports innocence. Both must be examined and reported objectively.","Admissible may be presented at trial; inadmissible may not. Tainted is the lecture term for evidence obtained by an illegal search/seizure. Material is relevant/significant; immaterial lacks that significance.","Direct evidence rests on a witness's personal knowledge/observation. Circumstantial (indirect) evidence supports an inference. Hearsay is the lecture's secondhand-evidence category; legal exceptions depend on the governing rules.","Corpus delicti evidence establishes that a crime occurred. The deck's 'artifact evidence' means an alteration that misleads the investigator into linking evidence to the crime; this is narrower than the general forensic use of 'artifact' for a trace."]},{"title":"Quality principles and trace interpretation","ref":"02-2 · slides 7–14","points":["Evidence can start an investigation, support it or be central to it. A device may be a tool of the crime, its target, or incidental storage of relevant traces.","The four lecture principles: relevance (connected to the inquiry), reliability (auditable/repeatable handling), sufficiency (enough material) and admissibility (usable in court).","Auditable: a complete trail allows later review. Repeatable: same investigator, tools and procedure obtain the same result. Reproducible: another investigator using different tools or independent methods reaches the same conclusion. Justifiable: explain why each action was appropriate.","Locard's exchange principle: contact leaves and transfers traces. Logs or histories may link participants, systems and events, but incomplete or altered traces require corroboration.","Digital evidence is fragile: shutdown loses unsaved/volatile data, writes can overwrite remnants, and connectivity permits remote change. Do not presume a compromised computer or its utilities are trustworthy.","The lecture's best-evidence-rule slide favours originals and lists duplicate exceptions involving destruction or third-party possession. Keep that as slide-specific terminology; it is a simplified account of evidence law, not a reason to analyse an original disk directly."]},{"title":"Data types you must distinguish","ref":"02-2 · slides 15–19","points":["Volatile: lost on power-off, e.g. RAM, running processes, open connections, clipboard and logged-on sessions. It can reveal current activity, timeline clues and whether further collection is needed.","Transient: short-lived state such as memory-resident programs, cache and open connections. It overlaps with volatile data in the lecture.","Non-volatile: persistent storage, e.g. disk files, registry, logs, slack, unallocated clusters and the disk-based swap file. Persistent does not mean unchangeable.","Fragile: easily changed information temporarily on disk, such as access timestamps. Temporarily accessible: the slides' term for data only accessible for a limited time, such as encrypted filesystem information in an accessible state.","Active: daily operational data. Archival: long-term retained records. Backup: copies intended for recovery after loss or failure.","Residual: remnants after deletion until overwritten or otherwise removed. Metadata: information describing data, including format, creator and creation/modification history.","Slack: unused space inside allocated storage units at the end of a file. Unallocated space: storage units not currently assigned to an active file. Both can hold remnants; neither guarantees a recoverable deleted file."]},{"title":"Where to look for evidence","ref":"02-2 · slides 20–27","points":["Storage media: files and remnants. Smart cards/dongles/access devices: identity, permissions and access configuration. Cameras: images/video, timestamps and removable media. Phones/handhelds: contacts, messages, documents, calendars and account data.","NICs: MAC identifiers. Routers: configuration and network context. Servers: system/application evidence. Cables and port relationships help reconstruct connections.","Printers/copiers: jobs, buffers, usage records and timestamps where supported. Fax/answering machines: messages, call/send/receive records and documents. Scanners may carry physical marks relevant to another forensic examination.","GPS: destinations, waypoints, routes and travel logs. Watches: stored personal records depending on the device. Card skimmers: captured card data. Device capability determines what actually exists; do not assume every listed device stores every example."]},{"title":"Examination process and protection","ref":"02-2 · slides 28–45","points":["Sequence: assessment → acquisition → preservation → examination/analysis → documentation/reporting. Documentation and preservation continue throughout.","Assessment checks authority/scope, sought evidence, hardware/software, acquisition circumstances, priorities, package condition, electromagnetic risks and whether a battery-powered device needs continuous power.","Preparation records include business impact, network topology, interviews, legal/third-party outcomes, assessment logs and proposed course of action.","Common errors: casually rebooting/shutting down, trusting a suspicious system, lacking baseline information and failing to document collection. Consider expert RAM capture or live imaging where volatility/encryption matters.","Physical extraction works across the acquired physical address space, including areas outside active files. Logical extraction uses OS/filesystem/application structures to collect selected accessible data. Physical acquisition does not guarantee reading inaccessible sectors or recovering overwritten data.","Use write protection where appropriate and work from a verified copy. Use protective handling, antistatic packaging for media, suitable environmental conditions and secure storage.","Document as you work: date/time, action, outcome, irregularities, tools, OS/patch details, search authority and custody. Report relevant files, supporting/deleted files, searches, analysis and hiding techniques."]}]},{"id":"02-3/4","title":"Policies, Ethics, Tools & Equipment","deck":"02-3_4_Policies, Procedures and Ethics  Forensics Tools and Equipment.pptx","sections":[{"title":"Policy versus procedure","ref":"02-3/4 · slides 3–10","points":["Policy sets expectations and permitted/prohibited actions. Procedure gives the steps to implement them. Example: restrict unauthorised access (policy); sign in and escort visitors (procedure).","Both should be clear, lawful and enforceable. Procedures explain actions; policies specify consequences of violations. Employees can acknowledge policies by signing at hire; the slides also describe distributing policy updates internally.","Acceptable Use Policy: permitted use of computers/networks, websites/email, information distribution, confidential printing, website approval and media releases. It can support investigation of suspected misuse.","Incident Response Policy: what counts as an incident, whom to notify, team roles, who investigates, who restores systems, handling steps, escalation to law enforcement and contingency planning.","A forensics unit also needs a mission, personnel requirements, administration, service intake/retrieval, case management, evidence handling, case processing and technical procedures."]},{"title":"Ethical behaviour in a case","ref":"02-3/4 · slides 11–12","points":["ISFCE: objective and accurate findings, truthful testimony, avoidance of conflicts, validated methods, confidentiality and truthful credentials.","HTCIA: seek the truth and avoid wrongful conviction using sound collection and integrity. IACIS: thorough examination, accurate facts, unbiased opinions and no concealed findings that distort the case.","If a manager asks you to suppress an exculpatory file, preserve and report it. An investigator's role is to establish what the evidence supports, not to secure a preferred result.","Disclose conflicts and limitations. Do not discuss confidential case material outside authorised channels or imply a qualification you do not hold."]},{"title":"Tool → task associations","ref":"02-3/4 · slides 14–23; 02-1 · slides 52–58","points":["ProDiscover Forensic: disk evidence examination, reports and JPEG EXIF information. EnCase: disk/file examination and forensic acquisition/analysis. X-Ways Forensics: examination environment with imaging/cloning.","The Sleuth Kit (TSK): command-line tools/library for disk and filesystem analysis. Autopsy: graphical forensic platform using TSK. Do not treat the pair as only one command-line program.","FTK Imager: create and preview forensic images, export/recover data and calculate hashes. It is not interchangeable with every feature of the full FTK analysis suite.","CAINE, PALADIN and SANS SIFT: forensic/incident-response environments or distributions with bundled tools. The lecture describes Ubuntu-based environments; learn the task association rather than treating old version/platform claims as current specifications.","Wireshark: network packet analysis. Volatility: memory/RAM analysis. A memory-analysis framework is not the same function as an acquisition tool.","Hardware write blockers (e.g. Tableau/FastBloc in the slides) protect source media from writes. Hardware duplicators (Voom, Ninja, Tableau examples) acquire data. Choose a validated tool appropriate to the media and document its configuration."]}]},{"id":"03","title":"Data Acquisition — through slide 53","deck":"03-Data Acquisition.pptx","sections":[{"title":"Before acquisition and order of volatility","ref":"03 · slides 2–9","points":["Before shutdown, consider live processes, network connections, memory and full-disk encryption. Photograph the screen with a camera. Running commands or saving a screenshot on the suspect machine may change it; an expert documents justified live collection.","Preserve device/cable configuration, label wires and record BIOS/UEFI information under a controlled acquisition procedure. Transport directly and securely to the lab, with custody maintained.","Lecture order, most volatile first: CPU cache/registers and RAM → virtual memory/paging or swap file → disk drives → remote logs → archival media. Its second diagram also groups backups and printouts at the persistent end.","A swap file is disk-backed and non-volatile by storage type, yet may change rapidly on a running system. The order is a collection-priority model, not a claim that all earlier categories vanish immediately when power is removed.","Document filenames, sizes, contents and creation/modified/access times. Examine partitions, Recycle Bin, anomalies and recovery completeness. Correlate traces with activity and sources; explain findings in plain language."]},{"title":"Storage formats: raw, proprietary and AFF","ref":"03 · slides 11–14","points":["Raw: sequential bit-stream data in flat file(s), broadly readable and simple, with fast transfers. Uncompressed raw requires storage roughly equal to the acquired source data; validation and case metadata are typically separate.","Proprietary forensic formats: may add compression, segmentation and embedded metadata. Compatibility and segment-size limits depend on the format and tool. The lecture names EnCase, FTK, X-Ways and SMART.","AFF (Advanced Forensic Format): an open alternative supporting data and metadata, compressed or uncompressed images and segmentation. The lecture describes it as avoiding image-size restrictions of older alternatives.","Do not conflate format with method: raw/proprietary/AFF describe storage; disk-to-image/disk-to-disk describe output; physical/logical describe coverage; live/static describe acquisition state."]},{"title":"Filesystems and Windows collection clues","ref":"03 · slides 15–23","points":["A filesystem organises storage into files/directories, paths, access and recovery structures. Windows examples: FAT, NTFS, exFAT. Linux: EXT family (ext2/ext3/ext4). Mac: HFS, HFS+, APFS; the legacy slide also mentions UFS.","Windows evidence locations in the slides: files, slack, swap, unallocated clusters, unused/hidden partitions, hidden files, registry and legacy browser Index.dat files. Compare file signatures with names/extensions.","Tool associations in the volatile-data diagram: pslist—running processes; netstat—open sockets/connections; fport—applications/ports; psloggedon—logged-on users; nbtstat—NetBIOS connection/name context. These are lecture examples, not a command checklist to run casually on an exhibit.","Registry examples: HKLM Software/Microsoft/Windows/CurrentVersion Run, RunOnce, RunOnceEx, RunServices and RunServicesOnce, plus Windows NT/CurrentVersion/Winlogon. The slide also points to similar HKCU and HKEY_USERS/.DEFAULT locations. Registrar offers detailed registry examination.","Optical media: ISO 9660, CDFS and UDF. Slide associations: Rock Ridge—longer names/Unix permissions; Joliet—Unicode names; El Torito—bootable CD support; ISO 13490—multisession-related extension described in the lecture."]},{"title":"Static versus live acquisition","ref":"03 · slides 25–34","points":["Acquisition gathers evidence while preserving it as faithfully as possible. A duplicate protects the original, permits repeat examination and can be recreated from the preserved source. Poor duplication can overwrite remnants or change swap data.","Static: acquisition of storage from a powered-off system under controlled conditions. Prefer it when shutdown is acceptable and persistent/deleted data is the priority.","Live: collection while the system is running. Consider it for RAM/password material, an accessible encrypted volume, essential services that cannot stop or complex RAID. Live collection changes some system state; document the change and justification.","Static methods: source → write blocker → forensic workstation → destination; source → hardware duplicator → destination; or an examiner-controlled forensic boot environment where drive access is impractical.","'Live CD' names boot media; it does not automatically make the acquisition live. Booting a powered-off exhibit with a controlled forensic environment is a deliberate acquisition procedure, not permission to boot its normal OS.","The lecture associates dd with copying and dcfldd with copying plus integrated hashing. A tool's mere presence on a boot disk does not establish write protection; verify the procedure and source protection."]},{"title":"Acquisition methods and selecting one","ref":"03 · slides 35–40","points":["Disk-to-image: bit-for-bit data stored in image file(s), the lecture's most common method. Disk-to-disk: clone to another device, including when older hardware/tool compatibility requires it.","Logical acquisition: selected files/types, such as Outlook .pst. Sparse acquisition: selected data plus relevant fragments of unallocated/deleted data as described by the slides.","Choose based on source size, time, location and whether the source can be retained. Add the case objective and data volatility when explaining a tactical choice. A logical copy may miss slack, unallocated data or other devices.","Plan capacity for images, metadata and working copies. Compression is optional and data-dependent; do not assume it will make an undersized destination sufficient.","Hardware examples: Voom Hardcopy, Tableau, Ninja Duplicator; local X-Forensik examples: Pendua (USB-based duplicator software) and Kloner (portable storage duplicator). Lecture comparison: hardware is typically faster/more expensive, software cheaper/slower; it is not a universal performance law.","Software environments named: DFLive, Helix and Kali. Ensure the selected mode/tool and procedure are suitable for forensics and do not mount the source read-write."]},{"title":"Tactics by location","ref":"03 · slides 41–49","points":["Data centre: arrange access/authority and pre-communication; consult the trusted administrator. Consider Linux/Unix, virtualisation, multiple domains per server, a separate database, offsite backups and RAID. Coordinate with operational staff, hosting provider and management.","Cyber café: many networked clients may be diskless and boot from server images. Examine server, cashier/manager PC, user records, CCTV and network infrastructure as relevant. A client may not have a local disk to image.","Office: map topology and interview IT/management to narrow targets. Relevant sources may include servers, staff PCs, CCTV/DVR, routers/switches and documents.","Home: identify computers, phones, storage, routers, cables and possible hidden devices/access points. An unsecured network may have other users; subscriber or device ownership alone does not establish who acted.","The lecture's broad OS/population examples describe its teaching scenarios; verify the actual scene rather than assuming a location has a particular OS."]},{"title":"RAID, remote acquisition and the final slides","ref":"03 · slides 50–53","points":["RAID means redundant array of independent disks. Determine RAID type, configuration, capacity and a compatible acquisition tool before proceeding. A firmware/hardware RAID may need acquisition through the running server. Document the array and member identities before disturbing it.","Remote network acquisition copies data over a network. The lecture's tools use a remote agent on the suspect system; endpoint/firewall controls may detect it. Authorisation, installation effects and connection limits must be documented.","Have a contingency plan. Make two acquisitions if storage allows so one remains available if the other corrupts. Validate using acquisition tools and record hashes and errors; two copies alone do not establish integrity.","Slide 53 points to imaging demonstrations with DD/DCFLDD, OSForensics and FTK Imager. It introduces no additional acquisition category. This guide covers the deck through that final slide."]}]}],"clarifications":[{"title":"Power decisions are conditional","text":"02-1 slide 49 says to unplug a running PC, while 03 slides 2–3 and 02-2 slide 35 highlight volatile data and encryption. Use the first-responder flowchart, identify the system and describe the risk before choosing. NIST also requires weighing live-collection value against changes and shutdown risks.","url":"https://nvlpubs.nist.gov/nistpubs/legacy/sp/nistspecialpublication800-86.pdf","label":"NIST SP 800-86, §§5.2.1–5.2.2"},{"title":"Mobile isolation is not one universal sequence","text":"02-0 slide 18 delegates power, isolation and onsite extraction to an expert; 02-2 slide 36 lists a shutdown approach. Radio isolation, device interaction and power loss each have tradeoffs. Airplane mode and shielding require care; neither should be assumed infallible.","url":"https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-101r1.pdf","label":"NIST SP 800-101 Rev. 1, radio isolation"},{"title":"Image compression and hash wording","text":"02-1 slide 22 describes compressed images, but 03 explicitly includes raw and uncompressed formats. Compression is optional. 02-1 slide 24 says access changes a hash: more precisely, a digest changes when the hashed bytes change; reading may indirectly change other metadata. Always identify what was hashed."},{"title":"Lecture terminology and dated claims","text":"Best-evidence-rule exceptions, warrant exceptions, tool versions, lab accreditations and legal examples are taught in simplified or dated form. Questions here either use stable concepts or explicitly say 'in the lecture'. 'Artifact evidence' uses the specific definition in 02-2 slide 4."}],"flashcards":[["01","Computer vs digital forensics?","Computer forensics centres on computers; digital forensics also includes phones, cameras and other digital devices.","01 · slide 5"],["01","Three central forensic goals?","Identify/analyse/reconstruct events; preserve original evidence; present admissible findings.","01 · slides 5–8"],["01","Criminal vs civil investigation?","Criminal: public offences, prosecution, deterrence/punishment. Civil: disputes between parties seeking remedies or compensation.","01 · slides 15–17"],["01","What governs private-sector cases in the lecture?","Company policies such as AUPs and employment contracts, within applicable authority and law.","01 · slide 19"],["01","Which Malaysian act is associated with unauthorised computer access?","Computer Crimes Act 1997, in the lecture's framework.","01 · slides 22–23"],["01","PDPA and CMA: lecture associations?","PDPA 2010: personal-data processing in commercial contexts. CMA 1998: networked communications and services. These are slide-level associations.","01 · slides 24, 27"],["01","Locard's exchange principle?","Contact transfers traces: a person/object takes something from a scene and leaves something behind. Digital traces still need context and corroboration.","02-2 · slide 11"],["01","What should IT avoid with a departing employee's evidence computer?","Reinstalling the OS, reassigning it, or casually changing power/state. Preserve, document and consider volatile data.","01 · slide 11"],["01","Which traces can help investigate a USB data transfer?","USB identity/connection history, recently accessed files, relevant browser history and supporting system records.","01 · slide 12"],["01","Which body is NISER's successor in the lecture account?","CyberSecurity Malaysia, with services including digital forensics, first response, recovery and expert witness work.","01 · slides 30–31"],["02-0","Five identification questions?","What crime? Who? Where? What resources? What documents? Preserve relevant initial information.","02-0 · slide 4"],["02-0","Three essential field documents?","Investigation diary/journal, seizure list and chain-of-custody form.","02-0 · slide 7"],["02-0","What should you do with unauthorised helpers?","Keep them away from evidence devices. Gather information through interviews without permitting unsupervised handling.","02-0 · slides 10–11"],["02-0","Computer: what details do you record?","Power/screen activity, clock offset, IP/MAC, serial, current account, owner and internet/ISP context.","02-0 · slide 16"],["02-0","IMEI vs IMSI vs ICCID?","IMEI identifies equipment; IMSI identifies a mobile subscriber; ICCID identifies the SIM card.","02-0 · slides 17–18"],["02-0","CCTV: the high-value field details?","Camera count/active cameras, channel-location map, clock offset, make/model and overwrite period.","02-0 · slide 19"],["02-0","Server cannot be imaged: lecture copy path?","Copy relevant files to a destination, archive that copy, hash, obtain occupier/investigator verification signatures, label/seal and document.","02-0 · slide 20"],["02-0","What else accompanies a captured web page?","Source code, account/device/viewing context, archived files and their hash; onsite verification documentation as applicable.","02-0 · slide 21"],["02-0","Who can perform pre-analysis in the SOP?","Expert or senior personnel only. Record start time, avoid edits/resaving and document changes because browsing can tamper with evidence.","02-0 · slide 22"],["02-0","Transport and labelling rules worth memorising?","Unique linked labels for devices/parts/cables, serials and photos; antistatic/shock protection; signed seizure list; unbroken custody; at least one person with vehicle evidence.","02-0 · slides 22–25"],["02-1","The three broad investigation phases?","Pre-investigation (prepare), investigation (scene/lab work), post-investigation (closure, return/storage and lessons).","02-1 · slides 6–7"],["02-1","The four-stage methodology and its continuous activity?","Identification → collection → analysis → presentation; preservation runs throughout.","02-1 · slides 27–44"],["02-1","First responder vs investigator?","FR identifies/preserves and handles initial collection with integrity; investigator establishes command and conducts the search. Agency SOP assigns overlapping tagging/transport duties.","02-1 · slides 4–5"],["02-1","Image vs clone?","Image: bit-level copy stored in file(s). Clone: bit-level copy onto another device. Both need appropriate acquisition and validation.","02-1 · slides 22–23"],["02-1","What does a hash comparison establish—and not establish?","It supports consistency of the hashed bytes. It does not establish authorship, truth of content, legal authority or custody on its own.","02-1 · slides 19, 24, 29"],["02-1","MD5 and SHA-1 hexadecimal lengths?","MD5: 32 hexadecimal characters (128 bits). SHA-1: 40 (160 bits).","02-1 · slide 24"],["02-1","Write blocker vs hash?","Write blocker prevents writes through the protected interface; hash comparison detects differences in the data scope being compared.","02-1 · slides 24–26"],["02-1","Why analyse a working copy?","To protect the original/master, permit repeat examinations and avoid contaminating source evidence.","02-1 · slides 36–37"],["02-1","Four presentation-quality words?","Accurate, repeatable, impartial and verifiable.","02-1 · slide 41"],["02-1","What belongs in a report?","Case/examiner details, authority/custody, scene records, methods, searches, relevant/supporting findings, analysis, conclusions and limitations, with supplementary material.","02-1 · slides 42–43"],["02-2","Inculpatory vs exculpatory?","Inculpatory supports guilt; exculpatory supports innocence. Report both objectively when relevant.","02-2 · slide 4"],["02-2","Material vs admissible?","Material means relevant/significant to the case; admissible means permitted for use at trial. They are not synonyms.","02-2 · slides 4–5"],["02-2","Direct vs circumstantial vs hearsay?","Direct: personal knowledge/observation. Circumstantial: facts supporting an inference. Hearsay: secondhand evidence in the lecture's definition.","02-2 · slide 5"],["02-2","Four evidence-quality principles?","Relevance, reliability, sufficiency and admissibility.","02-2 · slide 8"],["02-2","Auditable and justifiable?","Auditable: a full trail supports review. Justifiable: a clear, defensible reason supports each action.","02-2 · slide 9"],["02-2","Repeatable vs reproducible?","Repeatable: same investigator/tools/procedure, same result. Reproducible: different investigator/tools or independent methods, same conclusion.","02-2 · slide 9"],["02-2","Volatile vs non-volatile?","Volatile state is lost on power-off. Non-volatile storage persists but can still change or be overwritten.","02-2 · slides 15–18"],["02-2","Residual data vs metadata?","Residual data is leftover content after deletion. Metadata describes a file or its history, including format and timestamps.","02-2 · slide 19"],["02-2","Slack vs unallocated space?","Slack is unused space within a file's allocated unit. Unallocated space is not assigned to active files. Both may contain remnants.","02-1 · slides 37, 39; 02-2 · slide 15"],["02-2","Physical vs logical extraction?","Physical covers the acquired address space beyond active files; logical uses filesystem/OS/application structures to select accessible data. Neither guarantees every deleted item can be recovered.","02-2 · slides 39–40"],["02-3/4","Policy vs procedure?","Policy sets expectations and permitted actions; procedure gives the steps for a task or response.","02-3/4 · slides 3–4"],["02-3/4","What makes a policy/procedure usable?","Clear, understandable, lawful and enforceable, with specified actions; policies include consequences, procedures include task steps.","02-3/4 · slide 4"],["02-3/4","AUP vs Incident Response Policy?","AUP defines acceptable resource use. IR policy defines response roles, notification, handling, recovery and escalation.","02-3/4 · slides 6–9"],["02-3/4","What if a client asks you to hide contrary evidence?","Preserve and accurately report relevant findings. Maintain objectivity, confidentiality and professional integrity.","02-3/4 · slides 11–12"],["02-3/4","Three ethics organisations named?","ISFCE, HTCIA and IACIS. Their lecture themes include truth, objectivity, validated work and no concealed/distorted findings.","02-3/4 · slides 11–12"],["02-3/4","TSK vs Autopsy?","TSK is a library and command-line tool collection; Autopsy is a graphical forensic platform using TSK.","02-1 · slide 56"],["02-3/4","Wireshark vs Volatility?","Wireshark: network packets. Volatility: memory/RAM analysis.","02-3/4 · slides 22–23"],["02-3/4","FTK Imager's main uses?","Create and preview forensic images, export/recover data and calculate hashes.","02-1 · slide 58; 02-3/4 · slide 20"],["02-3/4","CAINE, PALADIN and SIFT are examples of what?","Forensic/incident-response environments or distributions containing collections of tools.","02-3/4 · slides 16–19"],["02-3/4","ProDiscover, EnCase and X-Ways: recall the roles.","ProDiscover: disk evidence, reports and EXIF. EnCase: acquisition and disk/file examination. X-Ways: forensic examination including imaging/cloning.","02-3/4 · slides 14, 18, 21"],["03","Order of volatility in the lecture?","Cache/registers and RAM → paging/swap → disk drives → remote logs → archive media/backups. Collect more loss-prone sources first when justified.","03 · slide 7"],["03","Raw format: one advantage and two limitations?","Broad tool readability/simple bit-stream; storage roughly equals acquired data without compression; case metadata/validation are normally separate.","03 · slides 12–14"],["03","Proprietary format vs AFF?","Proprietary containers offer vendor features with compatibility/segment constraints. AFF is an open alternative supporting metadata and optional compression.","03 · slides 11–14"],["03","Three axes that should not be confused?","Live/static: system state. Physical/logical: coverage. Raw/proprietary/AFF: storage format. Disk-to-image/disk-to-disk additionally describes output form.","03 · slides 11–14, 28–35"],["03","When consider live acquisition?","Volatile/key material, accessible encryption, business-critical uptime or complex RAID. Justify and document inevitable state changes.","03 · slides 2–3, 29"],["03","What is sparse acquisition?","The lecture's selected-data method that also collects relevant fragments of unallocated/deleted data.","03 · slide 35"],["03","Filesystem examples by OS?","Windows: FAT/NTFS/exFAT. Linux: EXT family. Mac: HFS/HFS+/APFS. Optical-media examples include ISO 9660/CDFS/UDF.","03 · slides 15, 21–23"],["03","dd vs dcfldd in the lecture?","dd is presented as imaging/copying; dcfldd adds integrated hashing. Both require correct source/destination selection and protection.","03 · slide 39"],["03","What must be planned for RAID and remote acquisition?","RAID: type/configuration, members, capacity and suitable tool. Remote: authorised target, agent effects/detection, connection limits and validation.","03 · slides 50–51"],["03","Final acquisition rule of thumb?","Plan a fallback; make two acquisitions if storage permits; validate the acquisition and keep records. The final slide links DD/DCFLDD, OSForensics and FTK Imager demos.","03 · slides 52–53"]],"questions":[{"type":"tf","topic":"01","q":"Digital forensics can include smartphones and digital cameras as well as computers.","a":true,"why":"Digital forensics has the broader device scope. Computer forensics technically centres on computers.","ref":"01 · slide 5"},{"type":"tf","topic":"01","q":"A private-sector investigation can concern an Acceptable Use Policy violation even if no criminal charge has been brought.","a":true,"why":"Private investigations include company-policy and employment-contract issues, as well as litigation.","ref":"01 · slide 19"},{"type":"tf","topic":"02-0","q":"A dark monitor proves that the computer is powered off.","a":false,"why":"The monitor may be off or asleep while the computer remains on. Establish and document the device state before acting.","ref":"02-2 · slide 34; 02-0 · slide 16"},{"type":"tf","topic":"02-0","q":"Any employee may conduct onsite pre-analysis if they promise not to edit files.","a":false,"why":"The SOP restricts pre-analysis to expert or senior personnel. Browsing can still change metadata or other state.","ref":"02-0 · slide 22"},{"type":"tf","topic":"02-0","q":"The First Responder SOP requires evidence in a vehicle to remain attended by at least one person.","a":true,"why":"A locked vehicle alone does not meet this lecture's transport rule.","ref":"02-0 · slide 24"},{"type":"tf","topic":"02-1","q":"Preservation begins only after the investigator finishes analysis.","a":false,"why":"Preservation and custody apply throughout identification, collection, analysis and presentation.","ref":"02-1 · slides 27–44"},{"type":"tf","topic":"02-1","q":"Matching hashes eliminate the need for a chain-of-custody record.","a":false,"why":"Hashes support content integrity. Custody records establish handling and transfers; they serve different purposes.","ref":"02-1 · slides 19, 24, 44"},{"type":"tf","topic":"02-1","q":"A write blocker permits reads from the source while preventing writes to it.","a":true,"why":"Its purpose is source protection. It does not replace acquisition validation or documentation.","ref":"02-1 · slide 26"},{"type":"tf","topic":"02-1","q":"Every forensic image must be compressed.","a":false,"why":"The acquisition deck explicitly allows raw and uncompressed formats. An image can be compressed or uncompressed depending on format/settings.","ref":"03 · slides 12–14; clarification of 02-1 · slide 22"},{"type":"tf","topic":"02-2","q":"Exculpatory evidence can be omitted when the investigator believes the suspect is guilty.","a":false,"why":"Exculpatory evidence may clear a suspect. Objectivity requires reporting relevant findings, including those opposing the allegation.","ref":"02-2 · slide 4; 02-3/4 · slides 11–12"},{"type":"tf","topic":"02-2","q":"Non-volatile data cannot change.","a":false,"why":"Non-volatile means it can persist without power. Files, logs and disk-based metadata can still be altered or overwritten.","ref":"02-2 · slides 12, 15, 17"},{"type":"tf","topic":"02-2","q":"In the lecture, repeatability uses the same investigator, tools and procedures on the same evidence.","a":true,"why":"Reproducibility instead involves another investigator using different tools or independent methods and reaching the same conclusion.","ref":"02-2 · slide 9"},{"type":"tf","topic":"02-2","q":"Deleting a file necessarily removes all its content immediately.","a":false,"why":"Residual data may remain until reused or otherwise removed. Recovery is possible in some conditions, not guaranteed.","ref":"02-2 · slide 19"},{"type":"tf","topic":"02-3/4","q":"A procedure describes steps for carrying out a task, while a policy sets expectations and allowed actions.","a":true,"why":"The visitor example distinguishes a restriction policy from sign-in and escort procedures.","ref":"02-3/4 · slides 3–4"},{"type":"tf","topic":"02-3/4","q":"Wireshark is primarily associated with RAM-image analysis in these slides.","a":false,"why":"Wireshark analyses network packets. Volatility is the memory-analysis framework.","ref":"02-3/4 · slides 22–23"},{"type":"tf","topic":"03","q":"Logical acquisition of selected files necessarily includes all unallocated space.","a":false,"why":"Logical acquisition selects files/data through logical structures. The lecture distinguishes sparse acquisition, which additionally collects relevant deleted fragments.","ref":"03 · slide 35"},{"type":"tf","topic":"03","q":"An accessible encrypted system is one reason to consider live acquisition.","a":true,"why":"Shutdown can remove volatile key material or accessible state. A qualified examiner should justify and document the choice.","ref":"03 · slides 2–3, 29"},{"type":"tf","topic":"03","q":"The words 'Live CD' alone tell you whether the suspect system was acquired live or statically.","a":false,"why":"The deck includes a Live CD as a static acquisition method for a powered-off machine. Acquisition state and boot-media name are different concepts.","ref":"03 · slides 28–33"},{"type":"tf","topic":"03","q":"RAID type and tool compatibility should be established before planning a RAID acquisition.","a":true,"why":"Configuration and capacity influence the method; firmware/hardware RAID may need acquisition through the server.","ref":"03 · slide 50"},{"type":"tf","topic":"03","q":"The final acquisition guidance recommends a contingency plan, two acquisitions if storage permits, and validation.","a":true,"why":"The second acquisition provides resilience if one corrupts, while validation checks integrity.","ref":"03 · slide 52"},{"type":"mcq","topic":"01","q":"Which outcome best expresses the central purpose of digital forensics?","options":["Reconstruct events using preserved, scientifically examined evidence","Restore every computer to service as quickly as possible","Prove the initial suspect guilty regardless of contrary findings","Collect the greatest possible number of devices"],"a":0,"why":"Preservation, event reconstruction and admissible findings are central. Restoration may be an incident-response task; device volume or a preferred verdict is not the forensic objective.","ref":"01 · slides 5–9"},{"type":"mcq","topic":"01","q":"Which lecture category involves a private party seeking damages from another party?","options":["Criminal investigation","Civil investigation","Administrative regulation","Laboratory quality assurance"],"a":1,"why":"Civil cases concern disputes and remedies between parties. Criminal and administrative categories have different purposes in the lecture.","ref":"01 · slides 15–18"},{"type":"mcq","topic":"01","q":"Which principle explains the expectation that contact with a scene transfers traces?","options":["Best evidence rule","Order of volatility","Locard's exchange principle","Segmentation principle"],"a":2,"why":"Locard describes transfer of traces. Volatility concerns persistence; best evidence concerns evidentiary originals/copies.","ref":"02-2 · slide 11; 01 · slide 3"},{"type":"mcq","topic":"01","q":"In the lecture's Malaysian framework, which act is associated with computer misuse and unauthorised access?","options":["Digital Signature Act 1997","Copyright Act 1987","Personal Data Protection Act 2010","Computer Crimes Act 1997"],"a":3,"why":"This is the act-name/topic association made on the CCA slide, not a statement about applying a specific current charge.","ref":"01 · slides 22–23"},{"type":"mcq","topic":"02-0","q":"Which document records transfers and handling of a seized drive?","options":["Chain-of-custody form","Network topology diagram","Acceptable Use Policy","Vendor brochure"],"a":0,"why":"The custody form follows the evidence. A topology diagram helps locate systems but does not document custodians.","ref":"02-0 · slide 7; 02-1 · slide 19"},{"type":"mcq","topic":"02-0","q":"Which is the best reason to sketch the premises and evidence locations?","options":["To replace all photographs","To convey and reconstruct the scene's spatial relationships","To prove the contents of every disk","To change the device timestamps to one common time"],"a":1,"why":"A sketch preserves relationships and locations. It complements photos and notes; it does not establish disk contents or justify clock changes.","ref":"02-0 · slide 12; 02-1 · slide 35"},{"type":"mcq","topic":"02-0","q":"Which identifier belongs to the mobile equipment rather than the subscriber or SIM card?","options":["IMSI","ICCID","IMEI","ISP"],"a":2,"why":"IMEI identifies equipment, IMSI the mobile subscriber and ICCID the SIM card. ISP names the internet service provider.","ref":"02-0 · slides 17–18"},{"type":"mcq","topic":"02-0","q":"A CCTV export is possible and its proprietary player is available. Which path matches the SOP flowchart?","options":["Film the screen and discard the original export","Change the recorder clock, then export","Export only a screenshot of the first frame","Consider native/proprietary export, hash it, then label and document"],"a":3,"why":"Native export with a player is the slide's preferred branch. The channel, date/time and clock offset must also be established.","ref":"02-0 · slide 19 flowchart"},{"type":"mcq","topic":"02-0","q":"What is the SOP's file-copy branch when a server cannot be fully imaged?","options":["Copy relevant data to destination, archive the copy, hash and obtain verification signatures","Archive the original folder in place and delete it after transfer","Take only a photograph of the desktop","Copy arbitrary files and skip documentation because the server remains onsite"],"a":0,"why":"The archive is created from the destination copy. The occupier/investigator verification, labels and records remain necessary.","ref":"02-0 · slide 20 flowchart"},{"type":"mcq","topic":"02-0","q":"Which web-evidence package most closely matches the lecture procedure?","options":["The page title alone","Relevant pages plus source code, viewing context, an archive and its hash","Only the owner's verbal description","Only the website's logo"],"a":1,"why":"The flowchart preserves pages and code. Context identifies the account, device and observation time; archiving and hashing support preservation.","ref":"02-0 · slide 21; 02-1 · slide 31"},{"type":"mcq","topic":"02-1","q":"Which activity belongs principally to the post-investigation phase?","options":["Choosing initial acquisition tools","Obtaining entry authority","Closing the case, managing evidence return/storage and reviewing lessons","Starting the first scene interview"],"a":2,"why":"Post-investigation covers proper closure and improvement. The other activities occur during preparation or scene investigation.","ref":"02-1 · slides 6–7"},{"type":"mcq","topic":"02-1","q":"Which pair is correct for conventional hexadecimal digest lengths?","options":["MD5 16 characters; SHA-1 20","MD5 40; SHA-1 32","MD5 64; SHA-1 128","MD5 32; SHA-1 40"],"a":3,"why":"MD5 is 128 bits (32 hex characters), SHA-1 is 160 bits (40). Characters and bits are different units.","ref":"02-1 · slide 24"},{"type":"mcq","topic":"02-1","q":"What most clearly distinguishes a forensic clone from an image file?","options":["A clone copies to a device; an image stores acquired data in file(s)","Only a clone can ever contain deleted remnants","An image is always compressed","A clone has no need for validation"],"a":0,"why":"Both can represent bit-level copies. Output form differs; compression and verification are separate considerations.","ref":"02-1 · slides 22–24; 03 · slide 35"},{"type":"mcq","topic":"02-1","q":"A hash mismatch appears during validation of a static acquisition. What is the best interpretation?","options":["The suspect is automatically guilty","The acquisition has not been validated; investigate scope, errors and changes","The custody form is no longer needed","Renaming the image will correct the mismatch"],"a":1,"why":"The same data scope and algorithm should validate for a stable source. A mismatch needs investigation and documentation; it is not evidence of a person's guilt.","ref":"02-1 · slides 24, 36–37; 03 · slide 52"},{"type":"mcq","topic":"02-1","q":"Which combination matches the lecture's presentation-quality requirements?","options":["Fast, secret, persuasive and final","Compressed, encrypted, branded and short","Accurate, repeatable, impartial and verifiable","Large, exhaustive, colourful and expensive"],"a":2,"why":"The report must faithfully communicate evidence and support checking. Persuasion or appearance cannot replace these qualities.","ref":"02-1 · slide 41"},{"type":"mcq","topic":"02-2","q":"A reliable log supports the suspect's claim that they were elsewhere. What is its potential evidentiary role?","options":["Inculpatory","Automatically inadmissible","Immaterial merely because it helps the suspect","Exculpatory"],"a":3,"why":"Exculpatory evidence supports innocence. Relevance and reliability still need assessment, but the investigator must not suppress it.","ref":"02-2 · slide 4"},{"type":"mcq","topic":"02-2","q":"Which is the best example of volatile data?","options":["A running process's RAM contents","An archived optical disk","A printed report","A powered-off backup drive's stored files"],"a":0,"why":"RAM state is lost when power is removed. The other examples persist without the running system.","ref":"02-2 · slides 15–18"},{"type":"mcq","topic":"02-2","q":"An independent examiner uses another tool and reaches the same conclusion. Which lecture property does this illustrate?","options":["Admissibility","Reproducibility","Immateriality","Volatility"],"a":1,"why":"Reproducibility involves independent confirmation. The slides reserve repeatability for the same investigator/tools/procedure.","ref":"02-2 · slide 9"},{"type":"mcq","topic":"02-2","q":"Which term describes unused bytes at the end of a file's allocated storage unit?","options":["All unallocated space","RAM cache","File slack","An entire hidden partition"],"a":2,"why":"Slack is within allocation assigned to a file. Unallocated space is not currently assigned to active files.","ref":"02-2 · slide 15; 02-1 · slides 37, 39"},{"type":"mcq","topic":"02-2","q":"Which lecture principle asks whether enough relevant material was gathered for the investigation?","options":["Reproducibility","Encryption","Authenticating a subscriber","Sufficiency"],"a":3,"why":"Sufficiency is about enough material. Relevance concerns connection to the case; reliability concerns trustworthy handling.","ref":"02-2 · slide 8"},{"type":"mcq","topic":"02-2","q":"Which is metadata rather than the main document content?","options":["The document's creation timestamp and recorded author","The full text of its argument","A photograph's depicted street scene","The spoken words of an audio recording"],"a":0,"why":"Metadata describes a file or its history. It requires interpretation and is not automatically proof of authorship.","ref":"02-2 · slide 19"},{"type":"mcq","topic":"02-3/4","q":"Which policy defines notification, response-team roles and when to contact law enforcement?","options":["Acceptable Use Policy only","Incident Response Policy","A file-naming convention","A vendor licensing policy"],"a":1,"why":"Incident Response Policy defines handling and escalation. Acceptable use principally describes permitted use of resources.","ref":"02-3/4 · slides 6–9"},{"type":"mcq","topic":"02-3/4","q":"Which tool association is correct?","options":["Wireshark—primary disk cloning utility","Volatility—visitor access policy","FTK Imager—forensic image creation and preview","Autopsy—only a hardware write blocker"],"a":2,"why":"FTK Imager supports acquisition and preview. Wireshark analyses packets, Volatility analyses memory, and Autopsy is a software forensic platform.","ref":"02-3/4 · slides 15, 20, 22–23"},{"type":"mcq","topic":"02-3/4","q":"Which conduct best follows the lecture's professional codes?","options":["Hide findings that weaken the client's allegation","Claim certification while still studying for it","Discuss a confidential exhibit with friends","Report accurate findings and disclose conflicts or limitations"],"a":3,"why":"Objectivity, truthful testimony/credentials, confidentiality and avoidance of conflicts support credibility.","ref":"02-3/4 · slides 11–12"},{"type":"mcq","topic":"02-3/4","q":"Which pair correctly relates the tools?","options":["TSK provides tools/library; Autopsy provides a graphical forensic platform using TSK","Autopsy is a packet-capture format; TSK is a SIM identifier","TSK is only a physical duplicator; Autopsy is its power supply","Both are names for a hash algorithm"],"a":0,"why":"The methodology deck distinguishes TSK's command-line/library role from Autopsy's graphical interface.","ref":"02-1 · slide 56"},{"type":"mcq","topic":"03","q":"You need Outlook .pst files only, within a limited authorised scope. Which method most directly matches that requirement?","options":["Always clone every connected disk","Logical acquisition","RAM-only acquisition","Always acquire the entire RAID"],"a":1,"why":"Logical acquisition targets specified files/types. State its narrower coverage rather than claiming it includes all deleted/unallocated material.","ref":"03 · slide 35"},{"type":"mcq","topic":"03","q":"Which method adds relevant deleted/unallocated fragments to a selected-data acquisition in the lecture?","options":["Ordinary file browsing","Policy acknowledgement","Sparse acquisition","Network disconnection"],"a":2,"why":"The slides distinguish sparse acquisition from a logical copy by its additional collection of deleted fragments.","ref":"03 · slide 35"},{"type":"mcq","topic":"03","q":"Which format is a broadly readable sequential flat representation, typically with separate case metadata/validation records?","options":["Every proprietary format","A printed seizure list","A chain-of-custody form","Raw"],"a":3,"why":"Raw offers interoperability and simplicity but lacks many embedded metadata/container features.","ref":"03 · slides 12–14"},{"type":"mcq","topic":"03","q":"Which format was presented as an open alternative supporting data, metadata and optional compression?","options":["AFF","IMSI","AUP","MAC"],"a":0,"why":"AFF means Advanced Forensic Format. The other abbreviations describe an identity, policy and network identifier.","ref":"03 · slides 11–14"},{"type":"mcq","topic":"03","q":"Which order follows the detailed volatility diagram from most volatile toward more persistent sources?","options":["Archives → disks → paging → RAM → cache","Cache → RAM → paging file → HDD → remote logs → archive media","HDD → cache → archives → RAM → paging","Remote logs → archive media → RAM → cache"],"a":1,"why":"The lecture prioritises the most changeable/loss-prone sources first. A paging file remains disk-backed despite its position in this priority diagram.","ref":"03 · slide 7"},{"type":"mcq","topic":"03","q":"Which condition most strongly supports considering live acquisition?","options":["The machine is off and the only target is deleted disk files","No trained examiner is available, so any user should experiment","A critical running service uses an accessible encrypted volume","The destination drive has the nicest label"],"a":2,"why":"Business continuity and encryption are listed live-acquisition reasons. The method still needs authority, competence and documentation.","ref":"03 · slides 28–29"},{"type":"mcq","topic":"03","q":"What is a key evidence-location risk in a diskless cyber café?","options":["Every client must contain an internal hard disk","Network topology is irrelevant","Only the cashier's keyboard can hold evidence","Client images or records may reside on a server elsewhere"],"a":3,"why":"The lecture describes server-backed diskless clients, so collection must account for server and network relationships.","ref":"03 · slides 43–45"},{"type":"mcq","topic":"03","q":"What should be established before dismantling an unfamiliar RAID?","options":["Array type/configuration, member identities, capacity and acquisition approach","Only the colour of the server case","The suspect's preferred operating system theme","Whether the examiner can skip validation"],"a":0,"why":"RAID configuration and compatible acquisition determine whether data can be reconstructed meaningfully. Some arrays require acquisition through the server.","ref":"03 · slide 50"},{"type":"mcq","topic":"03","q":"Which limitation is expressly mentioned for the lecture's remote acquisition tools?","options":["They eliminate all changes on the suspect system","A required remote agent may be detected by endpoint/firewall controls","They require no authorisation because acquisition is remote","They always acquire every cloud tenant"],"a":1,"why":"Installing/running an agent is part of this lecture's approach and may be detected. Remote operation does not remove scope or documentation requirements.","ref":"03 · slide 51"},{"type":"mcq","topic":"03","q":"Why make a second acquisition when sufficient storage is available?","options":["To replace the need for hashing","To guarantee that the suspect created every file","To retain another acquisition if one becomes corrupt","To permit deletion of the original evidence immediately"],"a":2,"why":"Redundancy supports continuity of analysis. Validation, custody and the required retention of originals still apply.","ref":"03 · slide 52"},{"type":"term","topic":"02-1","q":"The documented route of evidence through its custodians from discovery to closure or court.","a":"Chain of custody","why":"It records people, actions, transfers and times, maintaining accountability for handling.","ref":"02-1 · slides 10, 19"},{"type":"term","topic":"02-2","q":"Evidence that tends to indicate the suspect's guilt.","a":"Inculpatory evidence","why":"Contrast with exculpatory evidence, which supports innocence.","ref":"02-2 · slide 4"},{"type":"term","topic":"02-2","q":"Evidence that tends to clear a suspect of guilt.","a":"Exculpatory evidence","why":"Relevant exculpatory findings must be preserved and reported objectively.","ref":"02-2 · slide 4"},{"type":"term","topic":"02-2","q":"The lecture term for evidence obtained through an illegal search or seizure.","a":"Tainted evidence","why":"The deck distinguishes tainted evidence from the broader category of inadmissible evidence.","ref":"02-2 · slide 4"},{"type":"term","topic":"02-2","q":"Information in a running system that is lost when power is removed.","a":"Volatile data","why":"RAM, current processes and session state are common examples.","ref":"02-2 · slides 15–16"},{"type":"term","topic":"02-2","q":"Descriptive information about a file, such as its format, author and timestamps.","a":"Metadata","why":"Metadata describes data and its history; it must be interpreted in context.","ref":"02-2 · slide 19"},{"type":"term","topic":"02-2","q":"Remnants that may remain after a file is deleted until its space is reused or removed.","a":"Residual data","why":"Deletion can release allocation without immediately erasing the stored content.","ref":"02-2 · slide 19"},{"type":"term","topic":"02-1","q":"A device or software mechanism that allows source reads while preventing writes.","a":"Write blocker","why":"Write protection helps preserve original data during controlled acquisition.","ref":"02-1 · slide 26"},{"type":"term","topic":"02-1","q":"A mathematical digest of the bytes in a file or acquired data stream, used in integrity comparisons.","a":"Hash","why":"Its scope and algorithm must be recorded. It cannot establish custody or authorship on its own.","ref":"02-1 · slide 24"},{"type":"term","topic":"02-2","q":"The same investigator obtains the same result using the same tools and procedure on the same evidence.","a":"Repeatability","why":"This is the lecture's same-examiner definition, distinct from independent reproducibility.","ref":"02-2 · slide 9"},{"type":"term","topic":"02-2","q":"A different investigator reaches the same conclusion using different tools or independent methods.","a":"Reproducibility","why":"Independent confirmation strengthens confidence in the conclusion.","ref":"02-2 · slide 9"},{"type":"term","topic":"02-3/4","q":"The organisational policy describing permitted and prohibited use of computers and networks.","a":"Acceptable Use Policy","why":"An AUP covers appropriate use, including information distribution and resource restrictions.","ref":"02-3/4 · slides 6–7"},{"type":"term","topic":"03","q":"Acquisition while the encountered system continues to run, useful for volatile or accessible encrypted data.","a":"Live acquisition","why":"It preserves otherwise-lost opportunities but changes some state and requires documentation.","ref":"03 · slides 28–29"},{"type":"term","topic":"03","q":"The lecture method collecting selected files plus relevant fragments of unallocated/deleted data.","a":"Sparse acquisition","why":"This distinguishes it from the selected-file-only logical method described in the deck.","ref":"03 · slide 35"},{"type":"term","topic":"03","q":"The open image format described as an alternative to raw/proprietary limitations, supporting data and metadata.","a":"Advanced Forensic Format (AFF)","why":"The slides describe optional compression and metadata support.","ref":"03 · slides 11–14"},{"type":"scenario","topic":"02-0","q":"You arrive at a desktop with a black monitor. A colleague reaches for the power button to 'check whether it works'. What do you do next and why?","rubric":["Stop the casual power change and distinguish monitor sleep/off from the computer's power state.","Photograph/document the scene and observed state; if the computer is actually off, leave it off.","Follow the relevant on/off SOP branch, preserve evidence and record actions; seek an expert if the state is unclear."],"trap":"A black screen is not proof of a powered-off computer. Booting its normal OS can alter evidence.","ref":"02-0 · slide 16; 02-2 · slide 34"},{"type":"scenario","topic":"03","q":"A running laptop has an unlocked encrypted volume. No destructive activity is visible. A teammate proposes unplugging it immediately. Give your next steps.","rubric":["Photograph and record the screen/state, time and encryption/access context before interaction.","Request a qualified examiner to assess memory capture and live acquisition before power loss removes useful state.","Assess network risk, justify the chosen preservation/isolation method and document tools, actions and changes."],"trap":"The generic unplug rule must be weighed against RAM and encryption loss. Keeping power is not permission to browse freely.","ref":"03 · slides 2–3, 29; 02-2 · slide 35"},{"type":"scenario","topic":"02-0","q":"An office employee offers to open all the suspect's files and 'show you the evidence'. You are the first responder. How should you handle the offer?","rubric":["Move unauthorised people away from the devices and refuse unsupervised handling.","Interview the person for relevant facts, users and system information without letting them change evidence.","Use authorised, competent personnel and the documented SOP for any necessary access or pre-analysis."],"trap":"A helpful witness may provide information but is not automatically authorised to manipulate an exhibit.","ref":"02-0 · slides 10–11, 22"},{"type":"scenario","topic":"02-0","q":"A live phone may receive a remote-wipe command. A qualified mobile examiner is present. What should the first responder prioritise?","rubric":["Record screen state, time offset, make/model, unique identifiers and ownership as available.","Have the examiner choose and verify suitable radio isolation while assessing power/access-state consequences.","Document every interaction, preserve appropriate power and collect/label/seal the phone and accessories under the chosen SOP."],"trap":"Do not apply a universal remove-SIM-and-power-off sequence. SIM removal does not itself isolate every radio.","ref":"02-0 · slides 17–18; 02-2 · slides 35–37"},{"type":"scenario","topic":"02-0","q":"A CCTV event is needed before footage overwrites tonight. At reference time 16:10, the recorder says 16:02. Its proprietary player is available. Describe collection, including the time correction.","rubric":["Record the 8-minute slow clock offset, camera/channel map, active cameras and overwrite period without changing the clock.","Identify the relevant channel/window; add 8 minutes to recorder timestamps to map to reference time if the offset is stable, and export promptly in native format with player availability recorded.","Hash the exported evidence, label/seal it and document export actions, original timestamps and the
